<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #0d47a1; text-anchor: middle; }
      .title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #0d47a1; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="200" y="30" class="title">Sumar Dos Números</text>
  
  <!-- INICIO -->
  <ellipse cx="200" cy="80" rx="60" ry="30" class="box"/>
  <text x="200" y="88" class="text">INICIO</text>
  
  <!-- Flecha -->
  <line x1="200" y1="110" x2="200" y2="150" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Leer numero1 -->
  <path d="M 140,150 L 260,150 L 250,200 L 130,200 Z" class="box"/>
  <text x="195" y="180" class="text">Leer numero1</text>
  
  <!-- Flecha -->
  <line x1="195" y1="200" x2="195" y2="240" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Leer numero2 -->
  <path d="M 140,240 L 260,240 L 250,290 L 130,290 Z" class="box"/>
  <text x="195" y="270" class="text">Leer numero2</text>
  
  <!-- Flecha -->
  <line x1="195" y1="290" x2="195" y2="330" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- suma = numero1 + numero2 -->
  <rect x="120" y="330" width="160" height="50" rx="5" class="box"/>
  <text x="200" y="352" class="text">suma = numero1</text>
  <text x="200" y="370" class="text">+ numero2</text>
  
  <!-- Flecha -->
  <line x1="200" y1="380" x2="200" y2="420" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Mostrar suma -->
  <path d="M 140,420 L 260,420 L 250,470 L 130,470 Z" class="box"/>
  <text x="195" y="450" class="text">Mostrar suma</text>
  
  <!-- Flecha -->
  <line x1="195" y1="470" x2="195" y2="510" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- FIN -->
  <ellipse cx="195" cy="540" rx="60" ry="30" class="box"/>
  <text x="195" y="548" class="text">FIN</text>
  
  <!-- Notas explicativas -->
  <g opacity="0.7">
    <text x="320" y="180" font-family="Arial" font-size="11" fill="#666">← Pide el</text>
    <text x="320" y="195" font-family="Arial" font-size="11" fill="#666">primer número</text>
    
    <text x="320" y="270" font-family="Arial" font-size="11" fill="#666">← Pide el</text>
    <text x="320" y="285" font-family="Arial" font-size="11" fill="#666">segundo número</text>
    
    <text x="320" y="355" font-family="Arial" font-size="11" fill="#666">← Calcula</text>
    <text x="320" y="370" font-family="Arial" font-size="11" fill="#666">la suma</text>
    
    <text x="320" y="450" font-family="Arial" font-size="11" fill="#666">← Muestra</text>
    <text x="320" y="465" font-family="Arial" font-size="11" fill="#666">el resultado</text>
  </g>
</svg>
