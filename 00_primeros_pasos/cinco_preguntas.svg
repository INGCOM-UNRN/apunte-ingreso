<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .question-box { fill: #fff9c4; stroke: #f57c00; stroke-width: 2; }
      .answer-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #0d47a1; text-anchor: middle; }
      .question-text { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #e65100; }
      .answer-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #1565c0; }
      .number { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #fff; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Título principal -->
  <text x="350" y="35" class="title-text">Las 5 Preguntas Mágicas</text>
  <text x="350" y="55" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">
    Responde estas preguntas ANTES de diseñar tu algoritmo
  </text>
  
  <!-- Pregunta 1 -->
  <g transform="translate(30, 80)">
    <circle cx="20" cy="20" r="18" fill="#f57c00"/>
    <text x="20" y="27" class="number">1</text>
    
    <rect x="50" y="0" width="280" height="35" rx="5" class="question-box"/>
    <text x="60" y="23" class="question-text">¿Qué datos necesito?</text>
    
    <rect x="50" y="40" width="280" height="40" rx="5" class="answer-box"/>
    <text x="60" y="58" class="answer-text">→ ENTRADA: Variables, tipos de datos</text>
    <text x="60" y="73" class="answer-text" font-style="italic">Ej: dos números, un nombre, una edad</text>
  </g>
  
  <!-- Pregunta 2 -->
  <g transform="translate(370, 80)">
    <circle cx="20" cy="20" r="18" fill="#f57c00"/>
    <text x="20" y="27" class="number">2</text>
    
    <rect x="50" y="0" width="280" height="35" rx="5" class="question-box"/>
    <text x="60" y="23" class="question-text">¿Qué resultado quiero?</text>
    
    <rect x="50" y="40" width="280" height="40" rx="5" class="answer-box"/>
    <text x="60" y="58" class="answer-text">→ SALIDA: Lo que debe mostrar</text>
    <text x="60" y="73" class="answer-text" font-style="italic">Ej: el promedio, "es par", la suma</text>
  </g>
  
  <!-- Pregunta 3 -->
  <g transform="translate(30, 210)">
    <circle cx="20" cy="20" r="18" fill="#f57c00"/>
    <text x="20" y="27" class="number">3</text>
    
    <rect x="50" y="0" width="280" height="35" rx="5" class="question-box"/>
    <text x="60" y="23" class="question-text">¿Qué pasos debo seguir?</text>
    
    <rect x="50" y="40" width="280" height="55" rx="5" class="answer-box"/>
    <text x="60" y="58" class="answer-text">→ PROCESO: Operaciones en orden</text>
    <text x="60" y="73" class="answer-text" font-style="italic">Ej: 1) Leer datos, 2) Calcular,</text>
    <text x="60" y="88" class="answer-text" font-style="italic">3) Mostrar resultado</text>
  </g>
  
  <!-- Pregunta 4 -->
  <g transform="translate(370, 210)">
    <circle cx="20" cy="20" r="18" fill="#f57c00"/>
    <text x="20" y="27" class="number">4</text>
    
    <rect x="50" y="0" width="280" height="35" rx="5" class="question-box"/>
    <text x="60" y="23" class="question-text">¿Hay situaciones especiales?</text>
    
    <rect x="50" y="40" width="280" height="55" rx="5" class="answer-box"/>
    <text x="60" y="58" class="answer-text">→ CASOS ESPECIALES: Validaciones</text>
    <text x="60" y="73" class="answer-text" font-style="italic">Ej: división por cero, edad negativa,</text>
    <text x="60" y="88" class="answer-text" font-style="italic">lista vacía</text>
  </g>
  
  <!-- Pregunta 5 -->
  <g transform="translate(200, 340)">
    <circle cx="20" cy="20" r="18" fill="#f57c00"/>
    <text x="20" y="27" class="number">5</text>
    
    <rect x="50" y="0" width="280" height="35" rx="5" class="question-box"/>
    <text x="60" y="23" class="question-text">¿Necesito repetir algo?</text>
    
    <rect x="50" y="40" width="280" height="55" rx="5" class="answer-box"/>
    <text x="60" y="58" class="answer-text">→ REPETICIONES: Bucles/Lazos</text>
    <text x="60" y="73" class="answer-text" font-style="italic">Ej: "del 1 al 10", "N veces",</text>
    <text x="60" y="88" class="answer-text" font-style="italic">"hasta que ingrese 0"</text>
  </g>
  
  <!-- Flecha central de flujo -->
  <defs>
    <marker id="arrow-flow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <path d="M 350,130 L 350,150 L 340,180" 
        fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-flow)"/>
  <path d="M 340,270 L 350,290 L 350,310" 
        fill="none" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-flow)"/>
  
  <!-- Mensaje final -->
  <g opacity="0.9">
    <rect x="100" y="430" width="500" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
    <text x="350" y="450" font-family="Arial" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">
      💡 Si podés responder las 5 preguntas...
    </text>
    <text x="350" y="468" font-family="Arial" font-size="12" fill="#2e7d32" text-anchor="middle">
      ¡Ya entendiste el problema! Ahora podés diseñar la solución.
    </text>
  </g>
</svg>
