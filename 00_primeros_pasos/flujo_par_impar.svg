<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="650" viewBox="0 0 500 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .decision { fill: #fff9c4; stroke: #f57c00; stroke-width: 2; }
      .text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #0d47a1; text-anchor: middle; }
      .decision-text { font-family: 'Arial', sans-serif; font-size: 13px; fill: #e65100; text-anchor: middle; }
      .title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #0d47a1; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #2e7d32; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="250" y="30" class="title">¿Número Par o Impar?</text>
  
  <!-- INICIO -->
  <ellipse cx="250" cy="80" rx="60" ry="30" class="box"/>
  <text x="250" y="88" class="text">INICIO</text>
  
  <!-- Flecha -->
  <line x1="250" y1="110" x2="250" y2="150" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Leer edad -->
  <path d="M 190,150 L 310,150 L 300,200 L 180,200 Z" class="box"/>
  <text x="245" y="180" class="text">Leer numero</text>
  
  <!-- Flecha -->
  <line x1="245" y1="200" x2="245" y2="250" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- DECISIÓN: ¿numero % 2 == 0? -->
  <path d="M 250,250 L 360,310 L 250,370 L 140,310 Z" class="decision"/>
  <text x="250" y="305" class="decision-text">¿numero % 2</text>
  <text x="250" y="323" class="decision-text">== 0?</text>
  
  <!-- Rama SÍ (izquierda) -->
  <line x1="140" y1="310" x2="80" y2="310" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105" y="305" class="label">Sí</text>
  
  <path d="M 30,310 L 130,310 L 120,360 L 20,360 Z" class="box"/>
  <text x="75" y="330" class="text" font-size="12">Mostrar</text>
  <text x="75" y="348" class="text" font-size="12">"Es PAR"</text>
  
  <!-- Rama NO (derecha) -->
  <line x1="360" y1="310" x2="420" y2="310" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="305" class="label" fill="#c62828">No</text>
  
  <path d="M 370,310 L 470,310 L 460,360 L 360,360 Z" class="box"/>
  <text x="415" y="330" class="text" font-size="12">Mostrar</text>
  <text x="415" y="348" class="text" font-size="12">"Es IMPAR"</text>
  
  <!-- Flechas hacia abajo que se juntan -->
  <line x1="75" y1="360" x2="75" y2="450" stroke="#1976d2" stroke-width="2"/>
  <line x1="415" y1="360" x2="415" y2="450" stroke="#1976d2" stroke-width="2"/>
  
  <!-- Flechas horizontales que convergen -->
  <line x1="75" y1="450" x2="200" y2="450" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="450" x2="290" y2="450" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Línea vertical al FIN -->
  <line x1="245" y1="450" x2="245" y2="520" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- FIN -->
  <ellipse cx="245" cy="555" rx="60" ry="30" class="box"/>
  <text x="245" y="563" class="text">FIN</text>
  
  <!-- Explicaciones -->
  <g opacity="0.8">
    <rect x="20" y="470" width="210" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="125" y="490" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">
      El operador % da el resto
    </text>
    <text x="125" y="505" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">
      Si resto es 0 → PAR
    </text>
    <text x="125" y="520" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">
      Si resto es 1 → IMPAR
    </text>
  </g>
</svg>
