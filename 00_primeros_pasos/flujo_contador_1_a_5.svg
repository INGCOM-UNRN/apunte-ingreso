<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="750" viewBox="0 0 450 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .decision { fill: #fff9c4; stroke: #f57c00; stroke-width: 2; }
      .text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #0d47a1; text-anchor: middle; }
      .decision-text { font-family: 'Arial', sans-serif; font-size: 13px; fill: #e65100; text-anchor: middle; }
      .title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #0d47a1; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; }
      .loop-arrow { fill: none; stroke: #9c27b0; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="225" y="30" class="title">Contar del 1 al 5 (con bucle)</text>
  
  <!-- INICIO -->
  <ellipse cx="225" cy="80" rx="60" ry="30" class="box"/>
  <text x="225" y="88" class="text">INICIO</text>
  
  <!-- Flecha -->
  <line x1="225" y1="110" x2="225" y2="150" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- contador = 1 -->
  <rect x="155" y="150" width="140" height="40" rx="5" class="box"/>
  <text x="225" y="175" class="text">contador = 1</text>
  
  <!-- Flecha -->
  <line x1="225" y1="190" x2="225" y2="240" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- DECISIÓN: ¿contador <= 5? -->
  <path d="M 225,240 L 335,310 L 225,380 L 115,310 Z" class="decision"/>
  <text x="225" y="305" class="decision-text">¿contador</text>
  <text x="225" y="323" class="decision-text">&lt;= 5?</text>
  
  <!-- Rama SÍ (hacia abajo) -->
  <line x1="225" y1="380" x2="225" y2="420" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="405" class="label" fill="#2e7d32">Sí</text>
  
  <!-- Mostrar contador -->
  <path d="M 175,420 L 275,420 L 265,465 L 165,465 Z" class="box"/>
  <text x="220" y="447" class="text" font-size="13">Mostrar</text>
  <text x="220" y="460" class="text" font-size="13">contador</text>
  
  <!-- Flecha -->
  <line x1="220" y1="465" x2="220" y2="505" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- contador = contador + 1 -->
  <rect x="145" y="505" width="150" height="45" rx="5" class="box"/>
  <text x="220" y="525" class="text" font-size="12">contador =</text>
  <text x="220" y="542" class="text" font-size="12">contador + 1</text>
  
  <!-- Flecha de retorno (bucle) -->
  <path d="M 145,527 L 80,527 L 80,310 L 115,310" 
        class="loop-arrow" 
        marker-end="url(#loop-arrow)"/>
  
  <!-- Etiqueta del bucle -->
  <text x="50" y="320" font-family="Arial" font-size="11" fill="#9c27b0" font-weight="bold">
    ↑ BUCLE
  </text>
  <text x="50" y="335" font-family="Arial" font-size="10" fill="#9c27b0">
    Vuelve a
  </text>
  <text x="50" y="348" font-family="Arial" font-size="10" fill="#9c27b0">
    preguntar
  </text>
  
  <!-- Rama NO (hacia la derecha) -->
  <line x1="335" y1="310" x2="380" y2="310" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="305" class="label" fill="#c62828">No</text>
  
  <!-- Flecha que baja y va al FIN -->
  <line x1="380" y1="310" x2="380" y2="620" stroke="#c62828" stroke-width="2"/>
  <line x1="380" y1="620" x2="280" y2="620" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- FIN -->
  <ellipse cx="225" cy="655" rx="60" ry="30" class="box"/>
  <text x="225" y="663" class="text">FIN</text>
  
  <!-- Cuadro de ejecución de ejemplo -->
  <g opacity="0.9">
    <rect x="270" y="430" width="160" height="110" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5"/>
    <text x="350" y="450" font-family="Arial" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">
      Ejecución:
    </text>
    <text x="280" y="470" font-family="Courier New" font-size="10" fill="#444">
      1ª vuelta: contador=1
    </text>
    <text x="280" y="485" font-family="Courier New" font-size="10" fill="#444">
      2ª vuelta: contador=2
    </text>
    <text x="280" y="500" font-family="Courier New" font-size="10" fill="#444">
      3ª vuelta: contador=3
    </text>
    <text x="280" y="515" font-family="Courier New" font-size="10" fill="#444">
      4ª vuelta: contador=4
    </text>
    <text x="280" y="530" font-family="Courier New" font-size="10" fill="#444">
      5ª vuelta: contador=5
    </text>
  </g>
  
  <!-- Nota importante -->
  <g opacity="0.8">
    <rect x="15" y="580" width="190" height="65" fill="#ffebee" stroke="#c62828" stroke-width="1" rx="5"/>
    <text x="110" y="600" font-family="Arial" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">
      ¡IMPORTANTE!
    </text>
    <text x="110" y="617" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">
      Sin "contador + 1"
    </text>
    <text x="110" y="632" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">
      sería un bucle INFINITO
    </text>
  </g>
</svg>
