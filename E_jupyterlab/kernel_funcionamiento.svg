    <svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for markers -->
        <defs>
            <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
            </marker>
            <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A" />
            </marker>
            <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
            </marker>
        </defs>

        <!-- Main Title -->
        <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F2937">Arquitectura y Ciclo de Vida: Jupyter Kernel</text>

        <!--  AREA: FRONTEND (BROWSER)  -->
        <rect x="50" y="80" width="300" height="160" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" />
        <text x="65" y="105" font-weight="bold" fill="#1E40AF" font-size="14">Frontend (Navegador)</text>

        <!-- User Icon -->
        <circle cx="80" cy="140" r="15" fill="#6366F1" />
        <path d="M65 165 Q80 180 95 165" stroke="#6366F1" stroke-width="2" fill="none" />
        <text x="60" y="185" font-size="12" fill="#4B5563">Usuario</text>

        <!-- Input Cell -->
        <g transform="translate(110, 115)">
            <rect x="0" y="0" width="220" height="110" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" />
            <text x="10" y="20" font-family="monospace" font-size="14" fill="#374151">In [1]:</text>
            <text x="20" y="45" font-family="monospace" font-size="13" fill="#111827">x = 10</text>
            <text x="20" y="65" font-family="monospace" font-size="13" fill="#111827">y = 20</text>
            <text x="20" y="85" font-family="monospace" font-size="13" fill="#111827">print(x + y)</text>
        </g>

        <!--  AREA: BACKEND (KERNEL)  -->
        <rect x="450" y="80" width="300" height="280" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2" />
        <text x="465" y="105" font-weight="bold" fill="#9A3412" font-size="14">Backend (IPython Kernel)</text>

        <!-- Execution Logic -->
        <g transform="translate(480, 130)">
            <rect x="0" y="0" width="240" height="80" rx="4" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2" />
            <circle cx="20" cy="25" r="8" fill="#F59E0B" />
            <circle cx="20" cy="25" r="3" fill="#FFFFFF" />
            <text x="40" y="28" font-weight="bold" font-size="14" fill="#4B5563">Bucle de Ejecución</text>
            <text x="40" y="50" font-size="12" fill="#6B7280">1. Parse &amp; Compile (AST)</text>
            <text x="40" y="68" font-size="12" fill="#6B7280">2. Execute Bytecode</text>
        </g>

        <!-- Namespace / Memory -->
        <g transform="translate(480, 230)">
            <rect x="0" y="0" width="240" height="110" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
            <path d="M210 20 L225 20 L225 35 M215 25 L220 25 M218 30 L218 20" stroke="#B45309" fill="none" stroke-width="2"/> <!-- Save Icon representation -->
            <text x="15" y="25" font-weight="bold" font-size="13" fill="#92400E">Global Namespace (Memoria)</text>
            <line x1="15" y1="35" x2="225" y2="35" stroke="#FCD34D" stroke-width="2"/>
            
            <!-- Variables Grid -->
            <text x="25" y="60" font-family="monospace" font-size="14" fill="#78350F">x</text>
            <text x="50" y="60" font-family="monospace" font-size="14" fill="#4B5563">→</text>
            <text x="75" y="60" font-family="monospace" font-size="14" fill="#047857" font-weight="bold">10</text>
            <text x="120" y="60" font-size="11" fill="#9CA3AF">(int)</text>

            <text x="25" y="85" font-family="monospace" font-size="14" fill="#78350F">y</text>
            <text x="50" y="85" font-family="monospace" font-size="14" fill="#4B5563">→</text>
            <text x="75" y="85" font-family="monospace" font-size="14" fill="#047857" font-weight="bold">20</text>
            <text x="120" y="85" font-size="11" fill="#9CA3AF">(int)</text>
        </g>

        <!--  AREA: OUTPUT (RESULT)  -->
        <g transform="translate(110, 280)">
             <rect x="0" y="0" width="220" height="80" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
             <text x="10" y="25" font-family="monospace" font-size="14" fill="#374151">Out [1]:</text>
             <text x="20" y="55" font-family="monospace" font-size="16" fill="#15803D" font-weight="bold">30</text>
        </g>

        <!--  ARROWS & FLOW  -->

        <!-- 1. Send Code -->
        <path d="M330 170 L 440 170" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrowhead-blue)" />
        <text x="350" y="160" font-size="11" fill="#2563EB" font-weight="bold">1. Envío (ZMQ)</text>

        <!-- 2. Processing to Memory -->
        <path d="M600 210 L 600 220" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowhead-gray)" />
        <text x="610" y="220" font-size="10" fill="#EA580C">Persistencia</text>

        <!-- 3. Return Result -->
        <path d="M450 280 L 370 280 L 340 300" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)" />
        <text x="360" y="270" font-size="11" fill="#16A34A" font-weight="bold">2. stdout/pub</text>
        
        <!-- Warning Footer -->
        <g transform="translate(50, 480)">
             <path d="M0 -15 L 15 15 L -15 15 Z" fill="#F59E0B" transform="translate(15, 0)"/>
             <text x="15" y="8" text-anchor="middle" font-weight="bold" fill="white">!</text>
             <text x="40" y="5" font-size="13" fill="#4B5563" font-weight="bold">Nota Técnica: Persistencia en RAM</text>
             <text x="40" y="25" font-size="12" fill="#6B7280">
                El estado se mantiene en la memoria del proceso del Kernel activo.
                Reiniciar el kernel destruye el namespace y libera las variables.
             </text>
        </g>

    </svg>
