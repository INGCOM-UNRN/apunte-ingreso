<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550">
  <!-- Definiciones de estilos -->
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 3; }
      .box-kernel { fill: #fff3e0; stroke: #f57c00; stroke-width: 3; }
      .box-user { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 3; }
      .box-result { fill: #e8f5e9; stroke: #388e3c; stroke-width: 3; }
      .label { fill: #263238; font-family: 'Lato', sans-serif; font-size: 16px; font-weight: bold; }
      .label-big { fill: #263238; font-family: 'Lato', sans-serif; font-size: 18px; font-weight: bold; }
      .text { fill: #424242; font-family: 'Lato', sans-serif; font-size: 13px; }
      .code { fill: #263238; font-family: 'Google Sans Code', monospace; font-size: 13px; }
      .arrow { stroke: #1976d2; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-back { stroke: #388e3c; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1976d2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#388e3c" />
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="350" y="30" text-anchor="middle" class="label" font-size="24">Funcionamiento del Kernel de Python</text>
  
  <!-- ========== USUARIO ========== -->
  <g transform="translate(50, 80)">
    <!-- Ícono usuario -->
    <circle fill="#7b1fa2" cx="40" cy="25" r="18"/>
    <circle fill="#f3e5f5" cx="40" cy="25" r="12"/>
    <path fill="#7b1fa2" d="M 40 37 Q 25 45, 25 55 L 55 55 Q 55 45, 40 37 Z"/>
    
    <text x="70" y="35" class="label-big" fill="#7b1fa2">Usuario</text>
    <text x="70" y="55" class="text">Escribe código</text>
  </g>
  
  <!-- ========== CELDA DE CÓDIGO ========== -->
  <g transform="translate(100, 130)">
    <rect class="box" x="0" y="0" width="250" height="80" rx="5"/>
    
    <text x="125" y="20" text-anchor="middle" class="label" fill="#1976d2">Celda de Código</text>
    
    <text class="code" x="15" y="40">x = 10</text>
    <text class="code" x="15" y="58">y = 20</text>
    <text class="code" x="15" y="76">print(x + y)</text>
    
    <!-- Número de celda -->
    <text x="230" y="76" class="text" fill="#d32f2f">In [1]:</text>
  </g>
  
  <!-- Flecha 1: Usuario → Celda -->
  <path class="arrow" d="M 100 95 L 170 120"/>
  <text x="110" y="110" class="text" fill="#1976d2">1. Escribe</text>
  
  <!-- Flecha 2: Celda → Kernel -->
  <path class="arrow" d="M 225 210 L 225 270"/>
  <text x="240" y="245" class="text" fill="#1976d2">2. Envía código</text>
  
  <!-- ========== KERNEL (INTÉRPRETE PYTHON) ========== -->
  <g transform="translate(150, 280)">
    <rect class="box-kernel" x="0" y="0" width="150" height="100" rx="5"/>
    
    <!-- Logo Python simplificado -->
    <g transform="translate(20, 15)">
      <circle fill="#306998" cx="15" cy="15" r="12"/>
      <circle fill="#ffd43b" cx="35" cy="15" r="12"/>
      <circle fill="#fff" cx="12" cy="12" r="3"/>
      <circle fill="#fff" cx="38" cy="18" r="3"/>
    </g>
    
    <text x="75" y="35" text-anchor="middle" class="label" fill="#f57c00">Kernel</text>
    <text x="75" y="52" text-anchor="middle" class="text">(Python 3)</text>
    
    <text x="75" y="72" text-anchor="middle" class="text" font-size="11">Ejecuta el código</text>
    <text x="75" y="88" text-anchor="middle" class="text" font-size="11">10 + 20 = 30</text>
  </g>
  
  <!-- Flecha 3: Kernel → Resultado -->
  <path class="arrow-back" d="M 300 330 L 370 330"/>
  <text x="310" y="350" class="text" fill="#388e3c">3. Devuelve</text>
  
  <!-- ========== RESULTADO ========== -->
  <g transform="translate(380, 295)">
    <rect class="box-result" x="0" y="0" width="200" height="70" rx="5"/>
    
    <text x="100" y="20" text-anchor="middle" class="label" fill="#388e3c">Resultado (Output)</text>
    
    <text class="code" x="15" y="45" fill="#2e7d32">30</text>
    
    <!-- Número output -->
    <text x="170" y="65" class="text" fill="#d32f2f">Out[1]:</text>
  </g>
  
  <!-- Flecha 4: Resultado → Usuario -->
  <path class="arrow-back" d="M 480 295 L 120 110"/>
  <text x="300" y="190" class="text" fill="#388e3c">4. Muestra</text>
  
  <!-- ========== MEMORIA DEL KERNEL ========== -->
  <g transform="translate(50, 420)">
    <rect fill="#fff8e1" stroke="#ffa000" stroke-width="2" x="0" y="0" width="600" height="100" rx="5"/>
    
    <text x="300" y="25" text-anchor="middle" class="label" fill="#ff8f00">💾 Memoria del Kernel</text>
    
    <text x="20" y="50" class="text">El kernel <tspan font-weight="bold">recuerda</tspan> todas las variables y funciones que ejecutaste:</text>
    
    <g transform="translate(20, 55)">
      <rect fill="#e3f2fd" x="0" y="0" width="100" height="30" rx="3" stroke="#1976d2" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" class="code" font-size="12">x = 10</text>
      
      <rect fill="#e3f2fd" x="120" y="0" width="100" height="30" rx="3" stroke="#1976d2" stroke-width="1"/>
      <text x="170" y="20" text-anchor="middle" class="code" font-size="12">y = 20</text>
      
      <text x="240" y="20" class="text" font-size="12">← Guardadas en memoria</text>
    </g>
  </g>
  
  <!-- ========== NOTA IMPORTANTE ========== -->
  <g transform="translate(50, 535)">
    <text class="text" font-size="12" fill="#d32f2f" font-weight="bold">
      ⚠️ El kernel mantiene el estado entre celdas. Si reiniciás el kernel, toda la memoria se borra.
    </text>
  </g>
</svg>
