<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Definiciones de estilos -->
  <defs>
    <style>
      .area-menu { fill: #37474f; stroke: #263238; stroke-width: 2; }
      .area-sidebar { fill: #455a64; stroke: #263238; stroke-width: 2; }
      .area-trabajo { fill: #eceff1; stroke: #263238; stroke-width: 2; }
      .area-status { fill: #546e7a; stroke: #263238; stroke-width: 2; }
      .label-area { fill: white; font-family: 'Lato', sans-serif; font-size: 18px; font-weight: bold; }
      .label-num { fill: #ff6f00; font-family: 'Lato', sans-serif; font-size: 32px; font-weight: bold; }
      .menu-item { fill: #cfd8dc; font-family: 'Lato', sans-serif; font-size: 12px; }
      .folder-icon { fill: #ffa726; }
      .file-icon { fill: #42a5f5; }
      .notebook-content { fill: #263238; font-family: 'Google Sans Code', monospace; font-size: 11px; }
      .cell-code { fill: #fff3e0; stroke: #ff6f00; stroke-width: 1; }
      .cell-output { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6f00" />
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="450" y="30" text-anchor="middle" style="fill: #263238; font-family: Arial; font-size: 24px; font-weight: bold;">Interfaz de JupyterLab</text>
  
  <!-- Área 1: Barra de Menú Superior -->
  <rect class="area-menu" x="50" y="60" width="800" height="40" rx="4"/>
  <text class="menu-item" x="70" y="83">File</text>
  <text class="menu-item" x="115" y="83">Edit</text>
  <text class="menu-item" x="160" y="83">View</text>
  <text class="menu-item" x="210" y="83">Run</text>
  <text class="menu-item" x="255" y="83">Kernel</text>
  <text class="menu-item" x="315" y="83">Help</text>
  <circle cx="820" cy="80" r="6" fill="#f44336"/>
  <circle cx="805" cy="80" r="6" fill="#ffeb3b"/>
  <circle cx="790" cy="80" r="6" fill="#4caf50"/>
  
  <!-- Número 1 -->
  <text class="label-num" x="30" y="90" text-anchor="middle">1</text>
  
  <!-- Área 2: Panel Lateral (File Browser) -->
  <rect class="area-sidebar" x="50" y="110" width="200" height="410" rx="4"/>
  <text class="label-area" x="150" y="135" text-anchor="middle" font-size="14">File Browser</text>
  
  <!-- Carpetas y archivos simulados -->
  <g transform="translate(60, 150)">
    <!-- Carpeta 1 -->
    <rect class="folder-icon" x="0" y="0" width="20" height="16" rx="2"/>
    <path class="folder-icon" d="M 0 4 L 8 4 L 10 0 L 20 0 L 20 4 Z"/>
    <text class="menu-item" x="25" y="12">01_fundamentos</text>
    
    <!-- Archivo 1 -->
    <rect class="file-icon" x="20" y="25" width="16" height="18" rx="1"/>
    <rect fill="white" x="22" y="27" width="12" height="3"/>
    <rect fill="white" x="22" y="32" width="12" height="3"/>
    <rect fill="white" x="22" y="37" width="8" height="3"/>
    <text class="menu-item" x="40" y="38">variables.ipynb</text>
    
    <!-- Carpeta 2 -->
    <rect class="folder-icon" x="0" y="55" width="20" height="16" rx="2"/>
    <path class="folder-icon" d="M 0 59 L 8 59 L 10 55 L 20 55 L 20 59 Z"/>
    <text class="menu-item" x="25" y="67">02_control_flujo</text>
    
    <!-- Archivo 2 -->
    <rect class="file-icon" x="20" y="80" width="16" height="18" rx="1"/>
    <rect fill="white" x="22" y="82" width="12" height="3"/>
    <rect fill="white" x="22" y="87" width="12" height="3"/>
    <rect fill="white" x="22" y="92" width="8" height="3"/>
    <text class="menu-item" x="40" y="93">ejercicios.ipynb</text>
    
    <!-- Carpeta 3 -->
    <rect class="folder-icon" x="0" y="110" width="20" height="16" rx="2"/>
    <path class="folder-icon" d="M 0 114 L 8 114 L 10 110 L 20 110 L 20 114 Z"/>
    <text class="menu-item" x="25" y="122">03_estructuras</text>
  </g>
  
  <!-- Número 2 -->
  <text class="label-num" x="30" y="320" text-anchor="middle">2</text>
  
  <!-- Área 3: Área de Trabajo Central (Notebook) -->
  <rect class="area-trabajo" x="260" y="110" width="590" height="410" rx="4"/>
  <text class="label-area" x="555" y="135" text-anchor="middle" font-size="14" fill="#263238">notebook.ipynb</text>
  
  <!-- Simulación de celdas de notebook -->
  <g transform="translate(270, 150)">
    <!-- Celda de código -->
    <rect class="cell-code" x="0" y="0" width="570" height="60" rx="3"/>
    <text class="notebook-content" x="10" y="15">In [1]:</text>
    <text class="notebook-content" x="10" y="35"># Celda de código Python</text>
    <text class="notebook-content" x="10" y="50">print("Hola, JupyterLab!")</text>
    
    <!-- Output de celda -->
    <rect class="cell-output" x="0" y="65" width="570" height="25" rx="3"/>
    <text class="notebook-content" x="10" y="80">Hola, JupyterLab!</text>
    
    <!-- Celda Markdown -->
    <rect fill="#e3f2fd" stroke="#2196f3" stroke-width="1" x="0" y="100" width="570" height="50" rx="3"/>
    <text class="notebook-content" x="10" y="120" font-weight="bold">### Título de Sección</text>
    <text class="notebook-content" x="10" y="135">Texto explicativo en Markdown...</text>
    
    <!-- Otra celda de código -->
    <rect class="cell-code" x="0" y="160" width="570" height="60" rx="3"/>
    <text class="notebook-content" x="10" y="175">In [2]:</text>
    <text class="notebook-content" x="10" y="195">x = 10</text>
    <text class="notebook-content" x="10" y="210">y = 20</text>
    
    <!-- Barra de herramientas simplificada -->
    <g transform="translate(0, -35)">
      <rect fill="#cfd8dc" x="0" y="0" width="570" height="25" rx="2"/>
      <!-- Botón + -->
      <rect fill="#90a4ae" x="5" y="5" width="20" height="15" rx="2"/>
      <text x="15" y="17" text-anchor="middle" font-size="16" fill="white" font-weight="bold">+</text>
      <!-- Botón Run -->
      <polygon points="30,7 30,18 42,12.5" fill="#90a4ae"/>
      <!-- Botón Stop -->
      <rect fill="#90a4ae" x="50" y="7" width="12" height="11" rx="1"/>
      <!-- Botón Restart -->
      <circle cx="72" cy="12.5" r="6" fill="none" stroke="#90a4ae" stroke-width="2"/>
      <polygon points="72,7 76,11 72,11" fill="#90a4ae"/>
    </g>
  </g>
  
  <!-- Número 3 -->
  <text class="label-num" x="870" y="320" text-anchor="middle">3</text>
  
  <!-- Área 4: Barra de Estado Inferior -->
  <rect class="area-status" x="50" y="530" width="800" height="30" rx="4"/>
  <text class="menu-item" x="70" y="551" fill="white">Python 3 (ipykernel)</text>
  <circle cx="800" cy="545" r="5" fill="#4caf50"/>
  <text class="menu-item" x="810" y="551" fill="white">Ready</text>
  
  <!-- Número 4 -->
  <text class="label-num" x="30" y="550" text-anchor="middle">4</text>
  
  <!-- Leyenda -->
  <g transform="translate(50, 575)">
    <text style="fill: #263238; font-family: Arial; font-size: 12px; font-weight: bold;">
      <tspan x="0" y="0">1. Barra de Menú</tspan>
      <tspan x="200" y="0">2. Panel Lateral (Archivos)</tspan>
      <tspan x="450" y="0">3. Área de Trabajo</tspan>
      <tspan x="680" y="0">4. Barra de Estado</tspan>
    </text>
  </g>
</svg>
