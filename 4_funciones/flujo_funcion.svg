<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Título -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Flujo de Ejecución de una Función
  </text>
  
  <!-- Programa principal -->
  <rect x="50" y="60" width="250" height="480" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="175" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976d2">
    Programa Principal
  </text>
  
  <!-- Código principal -->
  <text x="70" y="120" font-family="monospace" font-size="14" fill="#000">
    print("Inicio")
  </text>
  
  <text x="70" y="155" font-family="monospace" font-size="14" fill="#000">
    x = 5
  </text>
  
  <text x="70" y="190" font-family="monospace" font-size="14" fill="#000">
    y = 3
  </text>
  
  <rect x="60" y="210" width="230" height="30" fill="#ffeb3b" stroke="#f57c00" stroke-width="2" rx="3"/>
  <text x="70" y="230" font-family="monospace" font-size="14" fill="#000" font-weight="bold">
    r = calcular_area(x, y)
  </text>
  
  <text x="70" y="360" font-family="monospace" font-size="14" fill="#000">
    print(r)  # 15
  </text>
  
  <text x="70" y="395" font-family="monospace" font-size="14" fill="#000">
    print("Fin")
  </text>
  
  <!-- Definición de función -->
  <rect x="500" y="60" width="250" height="300" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="625" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
    Función calcular_area
  </text>
  
  <!-- Código función -->
  <text x="520" y="120" font-family="monospace" font-size="14" fill="#0066cc">
    def
  </text>
  <text x="555" y="120" font-family="monospace" font-size="14" fill="#000">
    calcular_area(base, altura):
  </text>
  
  <rect x="510" y="135" width="230" height="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="3"/>
  <text x="530" y="155" font-family="monospace" font-size="14" fill="#000">
    area = base * altura
  </text>
  
  <rect x="510" y="180" width="230" height="30" fill="#ffcdd2" stroke="#c62828" stroke-width="2" rx="3"/>
  <text x="530" y="200" font-family="monospace" font-size="14" fill="#000" font-weight="bold">
    return area
  </text>
  
  <!-- Flechas de flujo -->
  <!-- 1. Llamada -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f57c00"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>
  
  <!-- Flecha llamada -->
  <path d="M 290 225 L 400 225 L 400 150 L 500 150" fill="none" stroke="#f57c00" stroke-width="3" marker-end="url(#arrowhead1)"/>
  <text x="340" y="215" font-size="14" fill="#f57c00" font-weight="bold">
    ① Llamada
  </text>
  <text x="410" y="185" font-size="12" fill="#f57c00">
    base=5, altura=3
  </text>
  
  <!-- Flecha retorno -->
  <path d="M 500 195 L 400 195 L 400 345 L 290 345" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead2)"/>
  <text x="340" y="335" font-size="14" fill="#c62828" font-weight="bold">
    ② Retorno
  </text>
  <text x="410" y="310" font-size="12" fill="#c62828">
    retorna 15
  </text>
  
  <!-- Explicaciones -->
  <rect x="50" y="440" width="700" height="140" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  
  <text x="70" y="465" font-size="14" font-weight="bold" fill="#2c3e50">
    Paso a paso:
  </text>
  
  <text x="70" y="490" font-size="13" fill="#333">
    1. El programa ejecuta línea por línea hasta la llamada a la función
  </text>
  
  <text x="70" y="515" font-size="13" fill="#333">
    2. Al llamar calcular_area(5, 3), el flujo "salta" a la función
  </text>
  
  <text x="70" y="540" font-size="13" fill="#333">
    3. La función ejecuta su código con los valores recibidos (base=5, altura=3)
  </text>
  
  <text x="70" y="565" font-size="13" fill="#333">
    4. Cuando llega al return, devuelve el valor 15 y el flujo vuelve al programa principal
  </text>
</svg>
