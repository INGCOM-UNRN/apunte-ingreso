<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Título -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Funciones Lambda: Funciones Anónimas
  </text>
  
  <!-- Función normal -->
  <rect x="50" y="70" width="320" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="70" y="95" font-size="16" font-weight="bold" fill="#1976d2">
    Función Normal
  </text>
  
  <rect x="70" y="105" width="280" height="130" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="90" y="130" font-family="monospace" font-size="14" fill="#0066cc">
    def
  </text>
  <text x="130" y="130" font-family="monospace" font-size="14" fill="#000">
    cuadrado(x):
  </text>
  <text x="100" y="155" font-family="monospace" font-size="14" fill="#0066cc">
    return
  </text>
  <text x="160" y="155" font-family="monospace" font-size="14" fill="#000">
    x ** 2
  </text>
  
  <text x="90" y="190" font-family="monospace" font-size="14" fill="#666">
    # Uso:
  </text>
  <text x="90" y="210" font-family="monospace" font-size="14" fill="#000">
    resultado = cuadrado(5)
  </text>
  <text x="90" y="225" font-family="monospace" font-size="14" fill="#666">
    # 25
  </text>
  
  <!-- Flecha de conversión -->
  <defs>
    <marker id="arrow-convert" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e65100"/>
    </marker>
  </defs>
  
  <path d="M 370 160 L 430 160" fill="none" stroke="#e65100" stroke-width="3" marker-end="url(#arrow-convert)"/>
  <text x="380" y="150" font-size="14" fill="#e65100" font-weight="bold">
    equivale a
  </text>
  
  <!-- Función lambda -->
  <rect x="430" y="70" width="320" height="180" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="450" y="95" font-size="16" font-weight="bold" fill="#e65100">
    Función Lambda (anónima)
  </text>
  
  <rect x="450" y="105" width="280" height="130" fill="#ffffff" stroke="#e65100" stroke-width="1" rx="3"/>
  <text x="470" y="130" font-family="monospace" font-size="14" fill="#000">
    cuadrado =
  </text>
  <text x="570" y="130" font-family="monospace" font-size="14" fill="#6f42c1" font-weight="bold">
    lambda
  </text>
  <text x="645" y="130" font-family="monospace" font-size="14" fill="#000">
    x: x ** 2
  </text>
  
  <text x="470" y="165" font-family="monospace" font-size="14" fill="#666">
    # Uso idéntico:
  </text>
  <text x="470" y="185" font-family="monospace" font-size="14" fill="#000">
    resultado = cuadrado(5)
  </text>
  <text x="470" y="205" font-family="monospace" font-size="14" fill="#666">
    # 25
  </text>
  
  <!-- Anatomía de lambda -->
  <rect x="50" y="270" width="700" height="210" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
  <text x="70" y="295" font-size="16" font-weight="bold" fill="#2c3e50">
    Anatomía de una Lambda
  </text>
  
  <!-- Diagrama de partes -->
  <rect x="70" y="310" width="660" height="60" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
  
  <text x="90" y="345" font-family="monospace" font-size="18" fill="#6f42c1" font-weight="bold">
    lambda
  </text>
  <text x="210" y="345" font-family="monospace" font-size="18" fill="#22863a">
    x, y
  </text>
  <text x="290" y="345" font-family="monospace" font-size="18" fill="#000">
    :
  </text>
  <text x="330" y="345" font-family="monospace" font-size="18" fill="#d73a49">
    x + y
  </text>
  
  <!-- Anotaciones -->
  <line x1="145" y1="350" x2="145" y2="390" stroke="#6f42c1" stroke-width="2"/>
  <text x="110" y="405" font-size="12" fill="#6f42c1" font-weight="bold">
    Palabra clave
  </text>
  
  <line x1="250" y1="350" x2="250" y2="390" stroke="#22863a" stroke-width="2"/>
  <text x="215" y="405" font-size="12" fill="#22863a" font-weight="bold">
    Parámetros
  </text>
  
  <line x1="310" y1="350" x2="310" y2="390" stroke="#000" stroke-width="2"/>
  <text x="298" y="405" font-size="12" fill="#000" font-weight="bold">
    :
  </text>
  
  <line x1="380" y1="350" x2="380" y2="390" stroke="#d73a49" stroke-width="2"/>
  <text x="330" y="405" font-size="12" fill="#d73a49" font-weight="bold">
    Expresión (retorno)
  </text>
  
  <!-- Casos de uso -->
  <rect x="70" y="420" width="660" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="90" y="440" font-size="13" fill="#2c3e50" font-weight="bold">
    💡 Cuándo usar lambda:
  </text>
  <text x="90" y="457" font-size="12" fill="#333">
    ✓ Funciones simples de una línea   ✓ Como argumento de otras funciones (map, filter, sorted)   ✗ Lógica compleja
  </text>
</svg>
