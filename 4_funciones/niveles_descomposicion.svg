<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Definiciones de estilos -->
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .nivel1 { fill: #1565c0; }
      .nivel2 { fill: #1976d2; }
      .nivel3 { fill: #2196f3; }
      .nivel4 { fill: #42a5f5; }
      .box { stroke: #0d47a1; stroke-width: 2; rx: 8; }
      .label-white { fill: white; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: bold; }
      .label-desc { fill: white; font-family: 'Lato', sans-serif; font-size: 11px; }
      .label-title { fill: #263238; font-family: 'Lato', sans-serif; font-size: 20px; font-weight: bold; }
      .label-nivel { fill: #1565c0; font-family: 'Lato', sans-serif; font-size: 13px; font-weight: bold; }
      .arrow { stroke: #1976d2; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2" />
    </marker>
  </defs>
  
  <!-- Título -->
  <text x="450" y="35" text-anchor="middle" class="label-title">Niveles de Descomposición Funcional</text>
  
  <!-- ========== NIVEL 1: ORQUESTACIÓN ========== -->
  <g transform="translate(250, 70)">
    <rect class="box nivel1" x="0" y="0" width="400" height="70"/>
    <text x="200" y="25" text-anchor="middle" class="label-white" font-size="16">main()</text>
    <text x="200" y="45" text-anchor="middle" class="label-desc">Función principal - Coordina todo el flujo</text>
    <text x="200" y="62" text-anchor="middle" class="label-desc" font-size="10">Nivel de abstracción más alto</text>
  </g>
  
  <!-- Etiqueta Nivel 1 -->
  <text x="50" y="115" class="label-nivel">NIVEL 1</text>
  <text x="50" y="130" style="fill: #546e7a; font-family: Arial; font-size: 11px;">Orquestación</text>
  
  <!-- Flechas Nivel 1 → Nivel 2 -->
  <path class="arrow" d="M 350 140 L 250 200"/>
  <path class="arrow" d="M 450 140 L 450 200"/>
  <path class="arrow" d="M 550 140 L 650 200"/>
  
  <!-- ========== NIVEL 2: OPERACIONES PRINCIPALES ========== -->
  <g transform="translate(50, 210)">
    <rect class="box nivel2" x="0" y="0" width="180" height="65"/>
    <text x="90" y="22" text-anchor="middle" class="label-white" font-size="13">cargar_datos()</text>
    <text x="90" y="40" text-anchor="middle" class="label-desc" font-size="10">Lee archivos o</text>
    <text x="90" y="54" text-anchor="middle" class="label-desc" font-size="10">bases de datos</text>
  </g>
  
  <g transform="translate(260, 210)">
    <rect class="box nivel2" x="0" y="0" width="180" height="65"/>
    <text x="90" y="22" text-anchor="middle" class="label-white" font-size="13">procesar_datos()</text>
    <text x="90" y="40" text-anchor="middle" class="label-desc" font-size="10">Realiza operaciones</text>
    <text x="90" y="54" text-anchor="middle" class="label-desc" font-size="10">complejas</text>
  </g>
  
  <g transform="translate(470, 210)">
    <rect class="box nivel2" x="0" y="0" width="180" height="65"/>
    <text x="90" y="22" text-anchor="middle" class="label-white" font-size="13">guardar_resultados()</text>
    <text x="90" y="40" text-anchor="middle" class="label-desc" font-size="10">Persiste datos</text>
    <text x="90" y="54" text-anchor="middle" class="label-desc" font-size="10">procesados</text>
  </g>
  
  <g transform="translate(680, 210)">
    <rect class="box nivel2" x="0" y="0" width="180" height="65"/>
    <text x="90" y="22" text-anchor="middle" class="label-white" font-size="13">mostrar_reporte()</text>
    <text x="90" y="40" text-anchor="middle" class="label-desc" font-size="10">Genera salida</text>
    <text x="90" y="54" text-anchor="middle" class="label-desc" font-size="10">formateada</text>
  </g>
  
  <!-- Etiqueta Nivel 2 -->
  <text x="50" y="255" class="label-nivel">NIVEL 2</text>
  <text x="50" y="270" style="fill: #546e7a; font-family: Arial; font-size: 11px;">Operaciones</text>
  
  <!-- Flechas Nivel 2 → Nivel 3 -->
  <path class="arrow" d="M 140 275 L 130 330"/>
  <path class="arrow" d="M 350 275 L 280 330"/>
  <path class="arrow" d="M 350 275 L 430 330"/>
  <path class="arrow" d="M 560 275 L 580 330"/>
  
  <!-- ========== NIVEL 3: OPERACIONES ESPECÍFICAS ========== -->
  <g transform="translate(30, 340)">
    <rect class="box nivel3" x="0" y="0" width="160" height="55"/>
    <text x="80" y="20" text-anchor="middle" class="label-white" font-size="12">leer_archivo()</text>
    <text x="80" y="37" text-anchor="middle" class="label-desc" font-size="9">Abre y lee</text>
    <text x="80" y="49" text-anchor="middle" class="label-desc" font-size="9">archivo</text>
  </g>
  
  <g transform="translate(210, 340)">
    <rect class="box nivel3" x="0" y="0" width="160" height="55"/>
    <text x="80" y="20" text-anchor="middle" class="label-white" font-size="12">validar_datos()</text>
    <text x="80" y="37" text-anchor="middle" class="label-desc" font-size="9">Verifica datos</text>
    <text x="80" y="49" text-anchor="middle" class="label-desc" font-size="9">correctos</text>
  </g>
  
  <g transform="translate(390, 340)">
    <rect class="box nivel3" x="0" y="0" width="160" height="55"/>
    <text x="80" y="20" text-anchor="middle" class="label-white" font-size="12">calcular_totales()</text>
    <text x="80" y="37" text-anchor="middle" class="label-desc" font-size="9">Suma, promedia</text>
    <text x="80" y="49" text-anchor="middle" class="label-desc" font-size="9">estadísticas</text>
  </g>
  
  <g transform="translate(570, 340)">
    <rect class="box nivel3" x="0" y="0" width="160" height="55"/>
    <text x="80" y="20" text-anchor="middle" class="label-white" font-size="12">formatear_salida()</text>
    <text x="80" y="37" text-anchor="middle" class="label-desc" font-size="9">Da formato</text>
    <text x="80" y="49" text-anchor="middle" class="label-desc" font-size="9">a texto</text>
  </g>
  
  <!-- Etiqueta Nivel 3 -->
  <text x="50" y="380" class="label-nivel">NIVEL 3</text>
  <text x="50" y="395" style="fill: #546e7a; font-family: Arial; font-size: 11px;">Específicas</text>
  
  <!-- Flechas Nivel 3 → Nivel 4 -->
  <path class="arrow" d="M 110 395 L 140 450"/>
  <path class="arrow" d="M 290 395 L 320 450"/>
  <path class="arrow" d="M 470 395 L 500 450"/>
  <path class="arrow" d="M 650 395 L 620 450"/>
  
  <!-- ========== NIVEL 4: OPERACIONES ATÓMICAS ========== -->
  <g transform="translate(110, 460)">
    <rect class="box nivel4" x="0" y="0" width="140" height="50"/>
    <text x="70" y="19" text-anchor="middle" class="label-white" font-size="11">es_numero()</text>
    <text x="70" y="35" text-anchor="middle" class="label-desc" font-size="8">Operación</text>
    <text x="70" y="45" text-anchor="middle" class="label-desc" font-size="8">simple</text>
  </g>
  
  <g transform="translate(270, 460)">
    <rect class="box nivel4" x="0" y="0" width="140" height="50"/>
    <text x="70" y="19" text-anchor="middle" class="label-white" font-size="11">esta_vacio()</text>
    <text x="70" y="35" text-anchor="middle" class="label-desc" font-size="8">Validación</text>
    <text x="70" y="45" text-anchor="middle" class="label-desc" font-size="8">básica</text>
  </g>
  
  <g transform="translate(430, 460)">
    <rect class="box nivel4" x="0" y="0" width="140" height="50"/>
    <text x="70" y="19" text-anchor="middle" class="label-white" font-size="11">sumar(a, b)</text>
    <text x="70" y="35" text-anchor="middle" class="label-desc" font-size="8">Operación</text>
    <text x="70" y="45" text-anchor="middle" class="label-desc" font-size="8">matemática</text>
  </g>
  
  <g transform="translate(590, 460)">
    <rect class="box nivel4" x="0" y="0" width="140" height="50"/>
    <text x="70" y="19" text-anchor="middle" class="label-white" font-size="11">redondear(n)</text>
    <text x="70" y="35" text-anchor="middle" class="label-desc" font-size="8">Transforma</text>
    <text x="70" y="45" text-anchor="middle" class="label-desc" font-size="8">dato</text>
  </g>
  
  <!-- Etiqueta Nivel 4 -->
  <text x="50" y="492" class="label-nivel">NIVEL 4</text>
  <text x="50" y="507" style="fill: #546e7a; font-family: Arial; font-size: 11px;">Atómicas</text>
  
  <!-- ========== LEYENDA ========== -->
  <line x1="50" y1="540" x2="850" y2="540" stroke="#cfd8dc" stroke-width="2"/>
  
  <g transform="translate(50, 555)">
    <text x="0" y="0" style="fill: #263238; font-family: Arial; font-size: 13px; font-weight: bold;">Principio:</text>
    <text x="0" y="20" style="fill: #546e7a; font-family: Arial; font-size: 12px;">
      • Funciones de nivel superior <tspan font-weight="bold">usan</tspan> las de nivel inferior
    </text>
    <text x="0" y="37" style="fill: #546e7a; font-family: Arial; font-size: 12px;">
      • Cada nivel tiene un propósito claro y un grado de abstracción específico
    </text>
  </g>
</svg>
