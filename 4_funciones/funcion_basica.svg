<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Título -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Anatomía de una Función
  </text>
  
  <!-- Código de función -->
  <rect x="50" y="60" width="700" height="280" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="5"/>
  
  <!-- Líneas de código -->
  <text x="70" y="95" font-family="monospace" font-size="18" fill="#6c757d">
    1
  </text>
  <text x="110" y="95" font-family="monospace" font-size="18" fill="#0066cc">
    def
  </text>
  <text x="165" y="95" font-family="monospace" font-size="18" fill="#cc0066">
    calcular_area
  </text>
  <text x="315" y="95" font-family="monospace" font-size="18" fill="#000">
    (
  </text>
  <text x="330" y="95" font-family="monospace" font-size="18" fill="#00aa00">
    base
  </text>
  <text x="390" y="95" font-family="monospace" font-size="18" fill="#000">
    ,
  </text>
  <text x="410" y="95" font-family="monospace" font-size="18" fill="#00aa00">
    altura
  </text>
  <text x="500" y="95" font-family="monospace" font-size="18" fill="#000">
    ):
  </text>
  
  <text x="70" y="130" font-family="monospace" font-size="18" fill="#6c757d">
    2
  </text>
  <text x="130" y="130" font-family="monospace" font-size="18" fill="#666">
    """Calcula el área de un rectángulo."""
  </text>
  
  <text x="70" y="165" font-family="monospace" font-size="18" fill="#6c757d">
    3
  </text>
  <text x="130" y="165" font-family="monospace" font-size="18" fill="#cc0066">
    area
  </text>
  <text x="190" y="165" font-family="monospace" font-size="18" fill="#000">
    =
  </text>
  <text x="215" y="165" font-family="monospace" font-size="18" fill="#00aa00">
    base
  </text>
  <text x="275" y="165" font-family="monospace" font-size="18" fill="#000">
    *
  </text>
  <text x="300" y="165" font-family="monospace" font-size="18" fill="#00aa00">
    altura
  </text>
  
  <text x="70" y="200" font-family="monospace" font-size="18" fill="#6c757d">
    4
  </text>
  <text x="130" y="200" font-family="monospace" font-size="18" fill="#0066cc">
    return
  </text>
  <text x="220" y="200" font-family="monospace" font-size="18" fill="#cc0066">
    area
  </text>
  
  <text x="70" y="235" font-family="monospace" font-size="18" fill="#6c757d">
    5
  </text>
  
  <text x="70" y="270" font-family="monospace" font-size="18" fill="#6c757d">
    6
  </text>
  <text x="110" y="270" font-family="monospace" font-size="18" fill="#666">
    # Llamada a la función
  </text>
  
  <text x="70" y="305" font-family="monospace" font-size="18" fill="#6c757d">
    7
  </text>
  <text x="110" y="305" font-family="monospace" font-size="18" fill="#cc0066">
    resultado
  </text>
  <text x="240" y="305" font-family="monospace" font-size="18" fill="#000">
    =
  </text>
  <text x="265" y="305" font-family="monospace" font-size="18" fill="#cc0066">
    calcular_area
  </text>
  <text x="430" y="305" font-family="monospace" font-size="18" fill="#000">
    (
  </text>
  <text x="445" y="305" font-family="monospace" font-size="18" fill="#0099cc">
    5
  </text>
  <text x="465" y="305" font-family="monospace" font-size="18" fill="#000">
    ,
  </text>
  <text x="485" y="305" font-family="monospace" font-size="18" fill="#0099cc">
    3
  </text>
  <text x="505" y="305" font-family="monospace" font-size="18" fill="#000">
    )
  </text>
  
  <!-- Anotaciones -->
  <!-- def -->
  <line x1="135" y1="100" x2="135" y2="350" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="135" cy="355" r="4" fill="#0066cc"/>
  <text x="10" y="370" font-size="14" fill="#0066cc" font-weight="bold">
    Palabra clave
  </text>
  
  <!-- nombre -->
  <line x1="240" y1="100" x2="240" y2="350" stroke="#cc0066" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="240" cy="355" r="4" fill="#cc0066"/>
  <text x="160" y="370" font-size="14" fill="#cc0066" font-weight="bold">
    Nombre de función
  </text>
  
  <!-- parámetros -->
  <line x1="410" y1="100" x2="410" y2="350" stroke="#00aa00" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="410" cy="355" r="4" fill="#00aa00"/>
  <text x="340" y="370" font-size="14" fill="#00aa00" font-weight="bold">
    Parámetros
  </text>
  
  <!-- return -->
  <line x1="170" y1="205" x2="170" y2="350" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="170" cy="355" r="4" fill="#0066cc"/>
  <text x="480" y="370" font-size="14" fill="#0066cc" font-weight="bold">
    Retorno
  </text>
  
  <!-- argumentos -->
  <line x1="475" y1="310" x2="475" y2="350" stroke="#0099cc" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="475" cy="355" r="4" fill="#0099cc"/>
  <text x="600" y="370" font-size="14" fill="#0099cc" font-weight="bold">
    Argumentos
  </text>
</svg>
