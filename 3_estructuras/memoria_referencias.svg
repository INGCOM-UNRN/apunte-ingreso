<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <style>
      .title { font: bold 24px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .text { font: 14px 'Consolas', monospace; fill: #2c3e50; }
      .var-name { font: bold 16px 'Consolas', monospace; fill: #8e44ad; }
      .value { font: bold 14px 'Consolas', monospace; fill: #27ae60; }
      .comment { font: 12px 'Segoe UI', Arial, sans-serif; fill: #7f8c8d; }
      .memory-box { fill: #e8f4f8; stroke: #3498db; stroke-width: 3; }
      .var-box { fill: #f3e5f5; stroke: #8e44ad; stroke-width: 2; }
      .arrow { fill: none; stroke: #e74c3c; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-double { fill: none; stroke: #f39c12; stroke-width: 3; marker-end: url(#arrowhead-orange); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f39c12" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">🧠 Referencias y Memoria: Cómo Python Guarda Datos</text>
  
  <!-- Caso 1: Tipos Inmutables (enteros) -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" class="subtitle">1️⃣ Tipos Inmutables (int, str, tuple)</text>
    
    <rect x="0" y="20" width="380" height="200" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <!-- Código -->
    <text x="20" y="45" class="text">a = 10</text>
    <text x="20" y="65" class="text">b = a</text>
    <text x="20" y="85" class="text">b = 20</text>
    
    <!-- Variables -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="80" height="50" class="var-box" rx="6"/>
      <text x="40" y="25" text-anchor="middle" class="var-name">a</text>
      <text x="40" y="42" text-anchor="middle" class="value">10</text>
      
      <rect x="0" y="70" width="80" height="50" class="var-box" rx="6"/>
      <text x="40" y="95" text-anchor="middle" class="var-name">b</text>
      <text x="40" y="112" text-anchor="middle" class="value">20</text>
    </g>
    
    <!-- Memoria -->
    <g transform="translate(200, 110)">
      <text x="0" y="-10" class="comment">MEMORIA:</text>
      
      <rect x="0" y="0" width="80" height="50" class="memory-box" rx="6"/>
      <text x="40" y="30" text-anchor="middle" class="value">10</text>
      
      <rect x="0" y="70" width="80" height="50" class="memory-box" rx="6"/>
      <text x="40" y="100" text-anchor="middle" class="value">20</text>
      
      <!-- Flechas -->
      <path d="M 80 25 L 120 25" class="arrow" transform="translate(-80, 0)"/>
      <path d="M 80 95 L 120 95" class="arrow" transform="translate(-80, 0)"/>
    </g>
    
    <text x="190" y="200" class="comment">✅ Valores separados - cambiar b NO afecta a</text>
  </g>
  
  <!-- Caso 2: Tipos Mutables (listas) -->
  <g transform="translate(470, 70)">
    <text x="0" y="0" class="subtitle">2️⃣ Tipos Mutables (list, dict, set)</text>
    
    <rect x="0" y="20" width="410" height="200" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <!-- Código -->
    <text x="20" y="45" class="text">lista1 = [1, 2, 3]</text>
    <text x="20" y="65" class="text">lista2 = lista1</text>
    <text x="20" y="85" class="text">lista2[0] = 999</text>
    
    <!-- Variables -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="100" height="50" class="var-box" rx="6"/>
      <text x="50" y="30" text-anchor="middle" class="var-name">lista1</text>
      
      <rect x="0" y="70" width="100" height="50" class="var-box" rx="6"/>
      <text x="50" y="100" text-anchor="middle" class="var-name">lista2</text>
    </g>
    
    <!-- Memoria -->
    <g transform="translate(200, 80)">
      <text x="0" y="-10" class="comment">MEMORIA:</text>
      
      <rect x="0" y="0" width="150" height="70" class="memory-box" rx="6"/>
      <text x="75" y="25" text-anchor="middle" class="value">[999, 2, 3]</text>
      <text x="75" y="45" text-anchor="middle" class="comment">¡MISMO OBJETO!</text>
      <text x="75" y="60" text-anchor="middle" class="comment">en memoria</text>
      
      <!-- Flechas a mismo objeto -->
      <path d="M 120 -55 Q 100 -20, 20 10" class="arrow"/>
      <path d="M 120 15 Q 100 30, 20 60" class="arrow-double"/>
    </g>
    
    <text x="20" y="200" class="comment">⚠️ Ambas variables apuntan al MISMO objeto</text>
  </g>
  
  <!-- Caso 3: Copiar correctamente -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" class="subtitle">3️⃣ Copia Correcta de Listas</text>
    
    <rect x="0" y="20" width="800" height="320" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <!-- Método 1: Slicing -->
    <g transform="translate(20, 35)">
      <text x="0" y="0" class="text" fill="#27ae60">✅ Método 1: Slicing [:]</text>
      <text x="0" y="25" class="text">original = [1, 2, 3]</text>
      <text x="0" y="45" class="text">copia = original[:]</text>
      <text x="0" y="65" class="text">copia[0] = 999</text>
      
      <rect x="0" y="80" width="100" height="40" class="var-box" rx="4"/>
      <text x="50" y="105" text-anchor="middle" class="text">original: [1, 2, 3]</text>
      
      <rect x="0" y="130" width="100" height="40" class="var-box" rx="4"/>
      <text x="50" y="155" text-anchor="middle" class="text">copia: [999, 2, 3]</text>
      
      <!-- Memoria separada -->
      <rect x="250" y="80" width="100" height="40" class="memory-box" rx="4"/>
      <text x="300" y="105" text-anchor="middle" class="value">[1, 2, 3]</text>
      
      <rect x="250" y="130" width="120" height="40" class="memory-box" rx="4"/>
      <text x="310" y="155" text-anchor="middle" class="value">[999, 2, 3]</text>
      
      <path d="M 100 100 L 250 100" class="arrow"/>
      <path d="M 100 150 L 250 150" class="arrow-double"/>
      
      <text x="400" y="110" class="comment">Objetos</text>
      <text x="400" y="130" class="comment">SEPARADOS</text>
    </g>
    
    <!-- Método 2: .copy() -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="text" fill="#27ae60">✅ Método 2: .copy()</text>
      <text x="0" y="25" class="text">original = [1, 2, 3]</text>
      <text x="0" y="45" class="text">copia = original.copy()</text>
      <text x="300" y="25" class="comment">← Más explícito y claro</text>
    </g>
    
    <!-- Método 3: list() -->
    <g transform="translate(20, 270)">
      <text x="0" y="0" class="text" fill="#27ae60">✅ Método 3: Constructor list()</text>
      <text x="0" y="25" class="text">original = [1, 2, 3]</text>
      <text x="0" y="45" class="text">copia = list(original)</text>
      <text x="300" y="25" class="comment">← Crea nueva lista desde iterable</text>
    </g>
  </g>
  
  <!-- Tip Final -->
  <g transform="translate(50, 630)">
    <rect x="0" y="0" width="800" height="40" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="6"/>
    <text x="15" y="25" class="text" fill="#856404">💡 Regla: Mutables se comparten por referencia, Inmutables se copian por valor</text>
  </g>
</svg>
