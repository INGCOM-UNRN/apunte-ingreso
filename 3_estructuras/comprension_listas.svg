<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .title { font: bold 24px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .text { font: 14px 'Consolas', monospace; fill: #2c3e50; }
      .highlight { font: bold 14px 'Consolas', monospace; }
      .comment { font: 12px 'Segoe UI', Arial, sans-serif; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .traditional { fill: #fadbd8; stroke: #e74c3c; stroke-width: 2; }
      .comprehension { fill: #d5f4e6; stroke: #27ae60; stroke-width: 2; }
      .part1 { fill: #3498db; }
      .part2 { fill: #e74c3c; }
      .part3 { fill: #f39c12; }
      .arrow { fill: none; stroke: #7f8c8d; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">⚡ List Comprehension: Crear Listas de Forma Concisa</text>
  
  <!-- Anatomía -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" class="subtitle"> Anatomía de List Comprehension</text>
    
    <rect x="0" y="20" width="800" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <!-- Partes coloreadas -->
    <text x="50" y="60" class="text">[</text>
    
    <!-- Parte 1: Expresión -->
    <rect x="70" y="42" width="100" height="28" class="part1" opacity="0.3" rx="4"/>
    <text x="75" y="62" class="highlight" fill="#3498db">expresión</text>
    
    <!-- Parte 2: for -->
    <rect x="185" y="42" width="180" height="28" class="part2" opacity="0.3" rx="4"/>
    <text x="190" y="62" class="highlight" fill="#e74c3c">for item in iterable</text>
    
    <!-- Parte 3: if (opcional) -->
    <rect x="380" y="42" width="140" height="28" class="part3" opacity="0.3" rx="4"/>
    <text x="385" y="62" class="highlight" fill="#f39c12">if condición</text>
    
    <text x="525" y="62" class="text">]</text>
    
    <!-- Flechas explicativas -->
    <text x="75" y="90" class="comment" fill="#3498db">↑ Qué hacer</text>
    <text x="190" y="90" class="comment" fill="#e74c3c">↑ Con cada elemento</text>
    <text x="385" y="90" class="comment" fill="#f39c12">↑ Si cumple esto</text>
  </g>
  
  <!-- Ejemplo 1: Comparación básica -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" class="subtitle">📊 Ejemplo 1: Crear Lista de Cuadrados</text>
    
    <!-- Forma tradicional -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" class="comment" fill="#e74c3c">❌ FORMA TRADICIONAL (4 líneas):</text>
      <rect x="0" y="10" width="380" height="100" class="traditional" rx="8"/>
      <text x="20" y="35" class="text">cuadrados = []</text>
      <text x="20" y="55" class="text">for num in range(1, 6):</text>
      <text x="40" y="75" class="text">    cuadrado = num ** 2</text>
      <text x="40" y="95" class="text">    cuadrados.append(cuadrado)</text>
    </g>
    
    <!-- Forma comprehension -->
    <g transform="translate(420, 20)">
      <text x="0" y="0" class="comment" fill="#27ae60">✅ LIST COMPREHENSION (1 línea):</text>
      <rect x="0" y="10" width="430" height="55" class="comprehension" rx="8"/>
      <text x="20" y="40" class="text">cuadrados = [</text><text x="140" y="40" class="highlight" fill="#3498db">num**2</text>
      <text x="220" y="40" class="highlight" fill="#e74c3c"> for num in range(1,6)</text><text x="450" y="40" class="text">]</text>
    </g>
    
    <!-- Resultado -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" class="comment">Ambas producen:</text>
      <text x="150" y="0" class="text">[1, 4, 9, 16, 25]</text>
    </g>
  </g>
  
  <!-- Ejemplo 2: Con filtro -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" class="subtitle">📊 Ejemplo 2: Filtrar Números Pares</text>
    
    <!-- Forma tradicional -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" class="comment" fill="#e74c3c">❌ FORMA TRADICIONAL (5 líneas):</text>
      <rect x="0" y="10" width="380" height="120" class="traditional" rx="8"/>
      <text x="20" y="35" class="text">pares = []</text>
      <text x="20" y="55" class="text">for num in range(10):</text>
      <text x="40" y="75" class="text">    if num % 2 == 0:</text>
      <text x="60" y="95" class="text">        pares.append(num)</text>
      <text x="20" y="115" class="comment"># [0, 2, 4, 6, 8]</text>
    </g>
    
    <!-- Forma comprehension -->
    <g transform="translate(420, 20)">
      <text x="0" y="0" class="comment" fill="#27ae60">✅ LIST COMPREHENSION (1 línea):</text>
      <rect x="0" y="10" width="430" height="55" class="comprehension" rx="8"/>
      <text x="20" y="40" class="text">pares = [</text>
      <text x="100" y="40" class="highlight" fill="#3498db">num</text>
      <text x="140" y="40" class="highlight" fill="#e74c3c"> for num in range(10)</text>
      <text x="360" y="40" class="highlight" fill="#f39c12"> if num%2==0</text>
      <text x="450" y="40" class="text">]</text>
    </g>
  </g>
  
  <!-- Ejemplo 3: Transformar strings -->
  <g transform="translate(50, 510)">
    <text x="0" y="0" class="subtitle">📊 Ejemplo 3: Transformar Lista de Strings</text>
    
    <rect x="0" y="20" width="800" height="160" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <text x="20" y="45" class="text">nombres = ["ana", "carlos", "beatriz", "david"]</text>
    
    <!-- Sin filtro -->
    <g transform="translate(20, 65)">
      <text x="0" y="0" class="comment">→ Convertir a mayúsculas:</text>
      <text x="0" y="20" class="text">mayus = [</text><text x="100" y="20" class="highlight" fill="#3498db">n.upper()</text>
      <text x="205" y="20" class="highlight" fill="#e74c3c"> for n in nombres</text><text x="395" y="20" class="text">]</text>
      <text x="0" y="38" class="comment">→ ["ANA", "CARLOS", "BEATRIZ", "DAVID"]</text>
    </g>
    
    <!-- Con filtro -->
    <g transform="translate(20, 115)">
      <text x="0" y="0" class="comment">→ Solo nombres largos (>5 letras):</text>
      <text x="0" y="20" class="text">largos = [</text><text x="110" y="20" class="highlight" fill="#3498db">n.upper()</text>
      <text x="215" y="20" class="highlight" fill="#e74c3c"> for n in nombres</text>
      <text x="405" y="20" class="highlight" fill="#f39c12"> if len(n) > 5</text><text x="570" y="20" class="text">]</text>
      <text x="0" y="38" class="comment">→ ["CARLOS", "BEATRIZ"]</text>
    </g>
  </g>
  
  <!-- Tip final -->
  <g transform="translate(50, 685)">
    <rect x="0" y="0" width="800" height="35" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="6"/>
    <text x="15" y="22" class="text" fill="#856404">💡 Tip: Lee de izquierda a derecha: "crea lista con [expresión] para cada [elemento] en [colección] si [condición]"</text>
  </g>
</svg>
