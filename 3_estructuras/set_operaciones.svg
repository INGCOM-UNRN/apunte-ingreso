<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Título -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#d84315">
    Sets: Operaciones de Conjuntos
  </text>
  
  <!-- Ejemplo de datos -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-size="14" fill="#333">Set A = {1, 2, 3, 4}</text>
    <text x="200" y="0" font-size="14" fill="#333">Set B = {3, 4, 5, 6}</text>
  </g>
  
  <!-- Unión -->
  <g transform="translate(100, 110)">
    <circle cx="80" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="#d84315" stroke-width="2"/>
    <circle cx="140" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="#d84315" stroke-width="2"/>
    
    <text x="110" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#d84315">
      UNIÓN (|)
    </text>
    <text x="110" y="130" font-size="14" text-anchor="middle" fill="#333">
      A | B = {1, 2, 3, 4, 5, 6}
    </text>
    <text x="110" y="150" font-size="12" text-anchor="middle" fill="#666">
      "Todos los elementos de ambos"
    </text>
  </g>
  
  <!-- Intersección -->
  <g transform="translate(400, 110)">
    <circle cx="80" cy="60" r="50" fill="white" fill-opacity="0.5" stroke="#d84315" stroke-width="2"/>
    <circle cx="140" cy="60" r="50" fill="white" fill-opacity="0.5" stroke="#d84315" stroke-width="2"/>
    <ellipse cx="110" cy="60" rx="30" ry="50" fill="#ffccbc" fill-opacity="0.7" stroke="none"/>
    
    <text x="110" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#d84315">
      INTERSECCIÓN (&amp;)
    </text>
    <text x="110" y="130" font-size="14" text-anchor="middle" fill="#333">
      A &amp; B = {3, 4}
    </text>
    <text x="110" y="150" font-size="12" text-anchor="middle" fill="#666">
      "Solo los comunes"
    </text>
  </g>
  
  <!-- Diferencia -->
  <g transform="translate(100, 300)">
    <circle cx="80" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="#d84315" stroke-width="2"/>
    <circle cx="140" cy="60" r="50" fill="white" fill-opacity="0.5" stroke="#d84315" stroke-width="2"/>
    <circle cx="80" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="none"/>
    
    <text x="110" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#d84315">
      DIFERENCIA (-)
    </text>
    <text x="110" y="130" font-size="14" text-anchor="middle" fill="#333">
      A - B = {1, 2}
    </text>
    <text x="110" y="150" font-size="12" text-anchor="middle" fill="#666">
      "Lo que está en A pero no en B"
    </text>
  </g>
  
  <!-- Diferencia Simétrica -->
  <g transform="translate(400, 300)">
    <circle cx="80" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="#d84315" stroke-width="2"/>
    <circle cx="140" cy="60" r="50" fill="#ffccbc" fill-opacity="0.7" stroke="#d84315" stroke-width="2"/>
    <ellipse cx="110" cy="60" rx="30" ry="50" fill="white" fill-opacity="1" stroke="none"/>
    
    <text x="110" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#d84315">
      DIF. SIMÉTRICA (^)
    </text>
    <text x="110" y="130" font-size="14" text-anchor="middle" fill="#333">
      A ^ B = {1, 2, 5, 6}
    </text>
    <text x="110" y="150" font-size="12" text-anchor="middle" fill="#666">
      "Lo que NO es común"
    </text>
  </g>
  
  <!-- Nota -->
  <text x="400" y="490" font-size="12" text-anchor="middle" fill="#666">
    💡 Los sets son ideales para operaciones matemáticas de conjuntos
  </text>
</svg>
