<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font: bold 24px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .text { font: 14px 'Consolas', monospace; fill: #2c3e50; }
      .method { font: bold 14px 'Consolas', monospace; fill: #e74c3c; }
      .comment { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .header { fill: #3498db; }
      .arrow { fill: none; stroke: #e74c3c; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">🧰 Métodos de Listas en Python</text>
  
  <!-- Agregar -->
  <g transform="translate(20, 60)">
    <rect class="box" width="230" height="140" rx="8"/>
    <rect class="header" width="230" height="35" rx="8"/>
    <text x="115" y="23" text-anchor="middle" fill="white" class="subtitle">➕ AGREGAR</text>
    
    <text x="10" y="55" class="method">.append(x)</text>
    <text x="10" y="70" class="comment">Agrega al final</text>
    
    <text x="10" y="95" class="method">.insert(i, x)</text>
    <text x="10" y="110" class="comment">Inserta en posición i</text>
    
    <text x="10" y="130" class="method">.extend(lista)</text>
    <text x="10" y="145" class="comment">Agrega varios al final</text>
  </g>
  
  <!-- Eliminar -->
  <g transform="translate(270, 60)">
    <rect class="box" width="230" height="140" rx="8"/>
    <rect class="header" width="230" height="35" rx="8" fill="#e74c3c"/>
    <text x="115" y="23" text-anchor="middle" fill="white" class="subtitle">🗑️ ELIMINAR</text>
    
    <text x="10" y="55" class="method">.remove(x)</text>
    <text x="10" y="70" class="comment">Elimina 1ª aparición</text>
    
    <text x="10" y="95" class="method">.pop(i)</text>
    <text x="10" y="110" class="comment">Elimina y devuelve</text>
    
    <text x="10" y="130" class="method">.clear()</text>
    <text x="10" y="145" class="comment">Vacía la lista</text>
  </g>
  
  <!-- Ordenar -->
  <g transform="translate(520, 60)">
    <rect class="box" width="260" height="140" rx="8"/>
    <rect class="header" width="260" height="35" rx="8" fill="#9b59b6"/>
    <text x="130" y="23" text-anchor="middle" fill="white" class="subtitle">🔄 ORDENAR</text>
    
    <text x="10" y="55" class="method">.sort()</text>
    <text x="10" y="70" class="comment">Ordena in-place (modifica)</text>
    
    <text x="10" y="95" class="method">.sort(reverse=True)</text>
    <text x="10" y="110" class="comment">Ordena descendente</text>
    
    <text x="10" y="130" class="method">.reverse()</text>
    <text x="10" y="145" class="comment">Invierte orden</text>
  </g>
  
  <!-- Buscar -->
  <g transform="translate(20, 220)">
    <rect class="box" width="230" height="140" rx="8"/>
    <rect class="header" width="230" height="35" rx="8" fill="#f39c12"/>
    <text x="115" y="23" text-anchor="middle" fill="white" class="subtitle">🔍 BUSCAR</text>
    
    <text x="10" y="55" class="method">.index(x)</text>
    <text x="10" y="70" class="comment">Posición de x</text>
    
    <text x="10" y="95" class="method">.count(x)</text>
    <text x="10" y="110" class="comment">Veces que aparece x</text>
    
    <text x="10" y="130" class="method">x in lista</text>
    <text x="10" y="145" class="comment">True si existe x</text>
  </g>
  
  <!-- Copiar -->
  <g transform="translate(270, 220)">
    <rect class="box" width="230" height="140" rx="8"/>
    <rect class="header" width="230" height="35" rx="8" fill="#16a085"/>
    <text x="115" y="23" text-anchor="middle" fill="white" class="subtitle">📋 COPIAR</text>
    
    <text x="10" y="55" class="method">.copy()</text>
    <text x="10" y="70" class="comment">Copia superficial</text>
    
    <text x="10" y="95" class="method">lista[:]</text>
    <text x="10" y="110" class="comment">También copia</text>
    
    <text x="10" y="130" class="method">list(original)</text>
    <text x="10" y="145" class="comment">Constructor copia</text>
  </g>
  
  <!-- Ejemplo Práctico -->
  <g transform="translate(20, 380)">
    <rect class="box" width="760" height="200" rx="8"/>
    <rect class="header" width="760" height="35" rx="8" fill="#27ae60"/>
    <text x="380" y="23" text-anchor="middle" fill="white" class="subtitle">💡 Ejemplo Práctico: Gestión de Tareas</text>
    
    <text x="20" y="60" class="text" fill="#c0392b">tareas = ["estudiar", "leer"]</text>
    <text x="20" y="85" class="text">tareas.</text><text x="85" y="85" class="method">append</text><text x="165" y="85" class="text">("ejercicio")</text>
    <text x="20" y="100" class="comment">→ ["estudiar", "leer", "ejercicio"]</text>
    
    <text x="20" y="130" class="text">tareas.</text><text x="85" y="130" class="method">insert</text><text x="155" y="130" class="text">(0, "desayunar")</text>
    <text x="20" y="145" class="comment">→ ["desayunar", "estudiar", "leer", "ejercicio"]</text>
    
    <text x="420" y="60" class="text">completada = tareas.</text><text x="630" y="60" class="method">pop</text><text x="665" y="60" class="text">(0)</text>
    <text x="420" y="75" class="comment">→ completada = "desayunar"</text>
    <text x="420" y="90" class="comment">→ tareas = ["estudiar", "leer", "ejercicio"]</text>
    
    <text x="420" y="120" class="text">tareas.</text><text x="485" y="120" class="method">sort</text><text x="530" y="120" class="text">()</text>
    <text x="420" y="135" class="comment">→ ["ejercicio", "estudiar", "leer"]</text>
    
    <text x="20" y="175" class="text" fill="#27ae60">print(f"Tengo {len(tareas)} tareas pendientes")</text>
  </g>
</svg>
