<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .title { font: bold 24px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .text { font: 14px 'Consolas', monospace; fill: #2c3e50; }
      .method { font: bold 14px 'Consolas', monospace; fill: #e74c3c; }
      .comment { font: 12px 'Segoe UI', Arial, sans-serif; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .header { fill: #3498db; }
      .result { fill: #d5f4e6; stroke: #27ae60; stroke-width: 1.5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">📝 Métodos de Strings en Python</text>
  
  <!-- Transformación -->
  <g transform="translate(20, 60)">
    <rect class="box" width="270" height="175" rx="8"/>
    <rect class="header" width="270" height="35" rx="8"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">🔄 TRANSFORMACIÓN</text>
    
    <text x="10" y="60" class="method">.upper()</text>
    <text x="10" y="75" class="comment">MAYÚSCULAS</text>
    
    <text x="10" y="100" class="method">.lower()</text>
    <text x="10" y="115" class="comment">minúsculas</text>
    
    <text x="10" y="140" class="method">.capitalize()</text>
    <text x="10" y="155" class="comment">Primera letra mayúscula</text>
    
    <text x="10" y="175" class="method">.title()</text>
    <text x="10" y="190" class="comment">Cada Palabra Con Mayúscula</text>
  </g>
  
  <!-- Búsqueda -->
  <g transform="translate(310, 60)">
    <rect class="box" width="270" height="175" rx="8"/>
    <rect class="header" width="270" height="35" rx="8" fill="#f39c12"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">🔍 BÚSQUEDA</text>
    
    <text x="10" y="60" class="method">.find(sub)</text>
    <text x="10" y="75" class="comment">Posición (-1 si no existe)</text>
    
    <text x="10" y="100" class="method">.count(sub)</text>
    <text x="10" y="115" class="comment">Cantidad de apariciones</text>
    
    <text x="10" y="140" class="method">.startswith(sub)</text>
    <text x="10" y="155" class="comment">Empieza con...</text>
    
    <text x="10" y="175" class="method">.endswith(sub)</text>
    <text x="10" y="190" class="comment">Termina con...</text>
  </g>
  
  <!-- Reemplazo -->
  <g transform="translate(610, 60)">
    <rect class="box" width="270" height="175" rx="8"/>
    <rect class="header" width="270" height="35" rx="8" fill="#e74c3c"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">✏️ REEMPLAZO</text>
    
    <text x="10" y="60" class="method">.replace(old, new)</text>
    <text x="10" y="75" class="comment">Reemplaza texto</text>
    
    <text x="10" y="100" class="method">.strip()</text>
    <text x="10" y="115" class="comment">Quita espacios extremos</text>
    
    <text x="10" y="140" class="method">.lstrip()</text>
    <text x="10" y="155" class="comment">Quita espacios izquierda</text>
    
    <text x="10" y="175" class="method">.rstrip()</text>
    <text x="10" y="190" class="comment">Quita espacios derecha</text>
  </g>
  
  <!-- División y Unión -->
  <g transform="translate(20, 255)">
    <rect class="box" width="270" height="155" rx="8"/>
    <rect class="header" width="270" height="35" rx="8" fill="#9b59b6"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">✂️ DIVISIÓN Y UNIÓN</text>
    
    <text x="10" y="60" class="method">.split(sep)</text>
    <text x="10" y="75" class="comment">Divide en lista</text>
    
    <text x="10" y="100" class="method">.join(lista)</text>
    <text x="10" y="115" class="comment">Une lista en string</text>
    
    <text x="10" y="140" class="method">.splitlines()</text>
    <text x="10" y="155" class="comment">Divide por saltos de línea</text>
  </g>
  
  <!-- Validación -->
  <g transform="translate(310, 255)">
    <rect class="box" width="270" height="155" rx="8"/>
    <rect class="header" width="270" height="35" rx="8" fill="#16a085"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">✅ VALIDACIÓN</text>
    
    <text x="10" y="60" class="method">.isdigit()</text>
    <text x="10" y="75" class="comment">¿Solo dígitos?</text>
    
    <text x="10" y="100" class="method">.isalpha()</text>
    <text x="10" y="115" class="comment">¿Solo letras?</text>
    
    <text x="10" y="140" class="method">.isalnum()</text>
    <text x="10" y="155" class="comment">¿Letras o números?</text>
  </g>
  
  <!-- Alineación -->
  <g transform="translate(610, 255)">
    <rect class="box" width="270" height="155" rx="8"/>
    <rect class="header" width="270" height="35" rx="8" fill="#d35400"/>
    <text x="135" y="23" text-anchor="middle" fill="white" class="subtitle">📐 ALINEACIÓN</text>
    
    <text x="10" y="60" class="method">.center(width)</text>
    <text x="10" y="75" class="comment">Centrar en ancho</text>
    
    <text x="10" y="100" class="method">.ljust(width)</text>
    <text x="10" y="115" class="comment">Alinear izquierda</text>
    
    <text x="10" y="140" class="method">.rjust(width)</text>
    <text x="10" y="155" class="comment">Alinear derecha</text>
  </g>
  
  <!-- Ejemplos Prácticos -->
  <g transform="translate(20, 430)">
    <rect x="0" y="0" width="860" height="250" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    <rect x="0" y="0" width="860" height="35" fill="#27ae60" rx="8"/>
    <text x="430" y="23" text-anchor="middle" fill="white" class="subtitle">💡 Ejemplos Prácticos</text>
    
    <!-- Ejemplo 1 -->
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="text">texto = "  Python es Genial  "</text>
      <text x="0" y="25" class="text">texto.</text><text x="65" y="25" class="method">strip</text><text x="120" y="25" class="text">()</text>
      <rect x="160" y="10" width="180" height="25" class="result" rx="4"/>
      <text x="170" y="28" class="text">"Python es Genial"</text>
    </g>
    
    <!-- Ejemplo 2 -->
    <g transform="translate(20, 90)">
      <text x="0" y="0" class="text">frase = "hola mundo"</text>
      <text x="0" y="25" class="text">frase.</text><text x="65" y="25" class="method">title</text><text x="115" y="25" class="text">()</text>
      <rect x="160" y="10" width="130" height="25" class="result" rx="4"/>
      <text x="170" y="28" class="text">"Hola Mundo"</text>
    </g>
    
    <!-- Ejemplo 3 -->
    <g transform="translate(20, 130)">
      <text x="0" y="0" class="text">email = "user@example.com"</text>
      <text x="0" y="25" class="text">email.</text><text x="65" y="25" class="method">split</text><text x="120" y="25" class="text">("@")</text>
      <rect x="160" y="10" width="220" height="25" class="result" rx="4"/>
      <text x="170" y="28" class="text">["user", "example.com"]</text>
    </g>
    
    <!-- Ejemplo 4 -->
    <g transform="translate(420, 50)">
      <text x="0" y="0" class="text">palabras = ["Python", "es", "cool"]</text>
      <text x="0" y="25" class="text">" ".</text><text x="40" y="25" class="method">join</text><text x="85" y="25" class="text">(palabras)</text>
      <rect x="210" y="10" width="180" height="25" class="result" rx="4"/>
      <text x="220" y="28" class="text">"Python es cool"</text>
    </g>
    
    <!-- Ejemplo 5 -->
    <g transform="translate(420, 90)">
      <text x="0" y="0" class="text">codigo = "ABC123"</text>
      <text x="0" y="25" class="text">codigo.</text><text x="80" y="25" class="method">isalnum</text><text x="160" y="25" class="text">()</text>
      <rect x="210" y="10" width="60" height="25" class="result" rx="4"/>
      <text x="220" y="28" class="text">True</text>
    </g>
    
    <!-- Ejemplo 6 -->
    <g transform="translate(420, 130)">
      <text x="0" y="0" class="text">ruta = "archivo.txt"</text>
      <text x="0" y="25" class="text">ruta.</text><text x="55" y="25" class="method">endswith</text><text x="145" y="25" class="text">(".txt")</text>
      <rect x="210" y="10" width="60" height="25" class="result" rx="4"/>
      <text x="220" y="28" class="text">True</text>
    </g>
    
    <!-- Tip -->
    <rect x="10" y="180" width="840" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="6"/>
    <text x="20" y="205" class="text" fill="#856404">💡 Tip: Los strings son inmutables - todos estos métodos devuelven un NUEVO string</text>
    <text x="20" y="223" class="comment" fill="#856404">El string original nunca se modifica. Siempre guardá el resultado en una variable.</text>
  </g>
</svg>
