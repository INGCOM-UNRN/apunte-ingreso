<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Título -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Lista vs Tupla: ¿Cuál usar?
  </text>
  
  <!-- Lista (izquierda) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="320" height="280" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10"/>
    
    <text x="160" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">
      LISTA [ ]
    </text>
    
    <text x="160" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      MUTABLE ✏️
    </text>
    
    <!-- Características -->
    <text x="20" y="110" font-size="14" fill="#333">✅ Se puede modificar</text>
    <text x="20" y="135" font-size="14" fill="#333">✅ Usar corchetes [ ]</text>
    <text x="20" y="160" font-size="14" fill="#333">✅ append(), remove(), etc.</text>
    <text x="20" y="185" font-size="14" fill="#333">✅ Más memoria</text>
    
    <!-- Cuándo usar -->
    <rect x="10" y="200" width="300" height="70" fill="white" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="160" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">
      ¿Cuándo usar?
    </text>
    <text x="160" y="240" font-size="12" text-anchor="middle" fill="#666">
      • Colección que cambia
    </text>
    <text x="160" y="255" font-size="12" text-anchor="middle" fill="#666">
      • Agregar/quitar elementos
    </text>
  </g>
  
  <!-- Tupla (derecha) -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="320" height="280" fill="#fff9c4" stroke="#f57f17" stroke-width="3" rx="10"/>
    
    <text x="160" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#f57f17">
      TUPLA ( )
    </text>
    
    <text x="160" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f17">
      INMUTABLE 🔒
    </text>
    
    <!-- Características -->
    <text x="20" y="110" font-size="14" fill="#333">✅ NO se puede modificar</text>
    <text x="20" y="135" font-size="14" fill="#333">✅ Usar paréntesis ( )</text>
    <text x="20" y="160" font-size="14" fill="#333">✅ Más rápida</text>
    <text x="20" y="185" font-size="14" fill="#333">✅ Menos memoria</text>
    
    <!-- Cuándo usar -->
    <rect x="10" y="200" width="300" height="70" fill="white" stroke="#f57f17" stroke-width="2" rx="5"/>
    <text x="160" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57f17">
      ¿Cuándo usar?
    </text>
    <text x="160" y="240" font-size="12" text-anchor="middle" fill="#666">
      • Datos que NO cambian
    </text>
    <text x="160" y="255" font-size="12" text-anchor="middle" fill="#666">
      • Coordenadas, fechas, constantes
    </text>
  </g>
  
  <!-- Nota al pie -->
  <text x="400" y="385" font-size="12" text-anchor="middle" fill="#666">
    💡 Regla: Si los datos cambian → Lista | Si los datos son fijos → Tupla
  </text>
</svg>
