<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Título -->
  <text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#333">
    Comparación de Estructuras de Datos
  </text>
  
  <!-- Headers -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="180" height="40" fill="#1565c0"/>
    <text x="90" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Estructura</text>
    
    <rect x="180" y="0" width="130" height="40" fill="#2e7d32"/>
    <text x="245" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Ordenada</text>
    
    <rect x="310" y="0" width="130" height="40" fill="#f57f17"/>
    <text x="375" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Mutable</text>
    
    <rect x="440" y="0" width="130" height="40" fill="#7b1fa2"/>
    <text x="505" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Duplicados</text>
    
    <rect x="570" y="0" width="230" height="40" fill="#d84315"/>
    <text x="685" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Cuándo Usar</text>
  </g>
  
  <!-- Lista -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="180" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">LISTA</text>
    <text x="90" y="50" font-size="14" text-anchor="middle" fill="#666">[ ]</text>
    <text x="90" y="70" font-size="12" text-anchor="middle" fill="#666">[1, 2, 3]</text>
    
    <rect x="180" y="0" width="130" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="245" y="45" font-size="24" text-anchor="middle" fill="#2e7d32">✓</text>
    
    <rect x="310" y="0" width="130" height="80" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="375" y="45" font-size="24" text-anchor="middle" fill="#f57f17">✓</text>
    
    <rect x="440" y="0" width="130" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="505" y="45" font-size="24" text-anchor="middle" fill="#7b1fa2">✓</text>
    
    <rect x="570" y="0" width="230" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="1"/>
    <text x="685" y="30" font-size="12" text-anchor="middle" fill="#333">Colección que</text>
    <text x="685" y="47" font-size="12" text-anchor="middle" fill="#333">cambia</text>
    <text x="685" y="64" font-size="11" text-anchor="middle" fill="#666">Lista de tareas</text>
  </g>
  
  <!-- Tupla -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="180" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">TUPLA</text>
    <text x="90" y="50" font-size="14" text-anchor="middle" fill="#666">( )</text>
    <text x="90" y="70" font-size="12" text-anchor="middle" fill="#666">(1, 2, 3)</text>
    
    <rect x="180" y="0" width="130" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="245" y="45" font-size="24" text-anchor="middle" fill="#2e7d32">✓</text>
    
    <rect x="310" y="0" width="130" height="80" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="375" y="45" font-size="24" text-anchor="middle" fill="#c62828">✗</text>
    
    <rect x="440" y="0" width="130" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="505" y="45" font-size="24" text-anchor="middle" fill="#7b1fa2">✓</text>
    
    <rect x="570" y="0" width="230" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="1"/>
    <text x="685" y="30" font-size="12" text-anchor="middle" fill="#333">Datos fijos</text>
    <text x="685" y="47" font-size="12" text-anchor="middle" fill="#333">inmutables</text>
    <text x="685" y="64" font-size="11" text-anchor="middle" fill="#666">Coordenadas (x,y)</text>
  </g>
  
  <!-- Diccionario -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="180" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">DICT</text>
    <text x="90" y="50" font-size="14" text-anchor="middle" fill="#666">{ }</text>
    <text x="90" y="70" font-size="11" text-anchor="middle" fill="#666">{"a": 1}</text>
    
    <rect x="180" y="0" width="130" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="245" y="45" font-size="20" text-anchor="middle" fill="#c62828">✗</text>
    <text x="245" y="65" font-size="10" text-anchor="middle" fill="#666">(desde 3.7: sí)</text>
    
    <rect x="310" y="0" width="130" height="80" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="375" y="45" font-size="24" text-anchor="middle" fill="#f57f17">✓</text>
    
    <rect x="440" y="0" width="130" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="505" y="35" font-size="20" text-anchor="middle" fill="#c62828">✗</text>
    <text x="505" y="55" font-size="10" text-anchor="middle" fill="#666">Claves</text>
    <text x="505" y="68" font-size="10" text-anchor="middle" fill="#666">únicas</text>
    
    <rect x="570" y="0" width="230" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="1"/>
    <text x="685" y="30" font-size="12" text-anchor="middle" fill="#333">Datos con</text>
    <text x="685" y="47" font-size="12" text-anchor="middle" fill="#333">clave-valor</text>
    <text x="685" y="64" font-size="11" text-anchor="middle" fill="#666">Perfil de usuario</text>
  </g>
  
  <!-- Set -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="180" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">SET</text>
    <text x="90" y="50" font-size="14" text-anchor="middle" fill="#666">{ }</text>
    <text x="90" y="70" font-size="12" text-anchor="middle" fill="#666">{1, 2, 3}</text>
    
    <rect x="180" y="0" width="130" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="245" y="45" font-size="24" text-anchor="middle" fill="#c62828">✗</text>
    
    <rect x="310" y="0" width="130" height="80" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="375" y="45" font-size="24" text-anchor="middle" fill="#f57f17">✓</text>
    
    <rect x="440" y="0" width="130" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="505" y="45" font-size="24" text-anchor="middle" fill="#c62828">✗</text>
    
    <rect x="570" y="0" width="230" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="1"/>
    <text x="685" y="30" font-size="12" text-anchor="middle" fill="#333">Elementos</text>
    <text x="685" y="47" font-size="12" text-anchor="middle" fill="#333">únicos</text>
    <text x="685" y="64" font-size="11" text-anchor="middle" fill="#666">Eliminar duplicados</text>
  </g>
  
  <!-- String -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="180" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">STRING</text>
    <text x="90" y="50" font-size="14" text-anchor="middle" fill="#666">" " o ' '</text>
    <text x="90" y="70" font-size="12" text-anchor="middle" fill="#666">"Hola"</text>
    
    <rect x="180" y="0" width="130" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="245" y="45" font-size="24" text-anchor="middle" fill="#2e7d32">✓</text>
    
    <rect x="310" y="0" width="130" height="80" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="375" y="45" font-size="24" text-anchor="middle" fill="#c62828">✗</text>
    
    <rect x="440" y="0" width="130" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="505" y="45" font-size="24" text-anchor="middle" fill="#7b1fa2">✓</text>
    
    <rect x="570" y="0" width="230" height="80" fill="#ffccbc" stroke="#d84315" stroke-width="1"/>
    <text x="685" y="30" font-size="12" text-anchor="middle" fill="#333">Texto</text>
    <text x="685" y="47" font-size="12" text-anchor="middle" fill="#333">inmutable</text>
    <text x="685" y="64" font-size="11" text-anchor="middle" fill="#666">Nombres, mensajes</text>
  </g>
  
  <!-- Leyenda -->
  <g transform="translate(50, 530)">
    <text x="0" y="15" font-size="12" fill="#666">
      💡 Elegí la estructura según tus necesidades: orden, mutabilidad y duplicados
    </text>
    <text x="0" y="35" font-size="11" fill="#666">
      ✓ = Sí | ✗ = No | Ordenada = mantiene el orden de inserción | Mutable = se puede modificar
    </text>
  </g>
</svg>
