<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .title { font: bold 24px 'Segoe UI', Arial, sans-serif; fill: #2c3e50; }
      .subtitle { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .text { font: 14px 'Consolas', monospace; fill: #2c3e50; }
      .var { font: bold 14px 'Consolas', monospace; fill: #8e44ad; }
      .value { font: bold 14px 'Consolas', monospace; fill: #27ae60; }
      .comment { font: 12px 'Segoe UI', Arial, sans-serif; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .tuple-box { fill: #e8daef; stroke: #8e44ad; stroke-width: 2; }
      .var-box { fill: #d5f4e6; stroke: #27ae60; stroke-width: 2; }
      .arrow { fill: none; stroke: #e74c3c; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-double { fill: none; stroke: #3498db; stroke-width: 2; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">➡️ Desempaquetado de Tuplas (Unpacking)</text>
  
  <!-- Ejemplo 1: Desempaquetado básico -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" class="subtitle">1️⃣ Desempaquetado Básico</text>
    
    <!-- Tupla -->
    <rect x="0" y="20" width="300" height="60" class="tuple-box" rx="8"/>
    <text x="10" y="45" class="text">coordenadas = (</text>
    <rect x="140" y="30" width="40" height="35" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="4"/>
    <text x="160" y="53" text-anchor="middle" class="value">10</text>
    <text x="185" y="53" class="text">,</text>
    <rect x="200" y="30" width="40" height="35" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="4"/>
    <text x="220" y="53" text-anchor="middle" class="value">20</text>
    <text x="245" y="53" class="text">)</text>
    
    <!-- Flecha hacia abajo -->
    <path d="M 150 85 L 150 110" class="arrow"/>
    <text x="170" y="100" class="comment">desempaquetar</text>
    
    <!-- Variables -->
    <g transform="translate(0, 115)">
      <rect x="30" y="0" width="80" height="50" class="var-box" rx="6"/>
      <text x="70" y="28" text-anchor="middle" class="var">x</text>
      <text x="70" y="43" text-anchor="middle" class="value">10</text>
      
      <rect x="170" y="0" width="80" height="50" class="var-box" rx="6"/>
      <text x="210" y="28" text-anchor="middle" class="var">y</text>
      <text x="210" y="43" text-anchor="middle" class="value">20</text>
      
      <text x="270" y="28" class="comment">← Cada variable</text>
      <text x="270" y="43" class="comment">   toma un valor</text>
    </g>
    
    <!-- Código -->
    <rect x="0" y="185" width="300" height="55" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="6"/>
    <text x="10" y="208" class="text">x, y = (10, 20)</text>
    <text x="10" y="228" class="comment">print(x)  # 10</text>
  </g>
  
  <!-- Ejemplo 2: Intercambio de valores -->
  <g transform="translate(400, 70)">
    <text x="0" y="0" class="subtitle">2️⃣ Intercambio Mágico </text>
    
    <!-- Antes -->
    <g transform="translate(0, 25)">
      <text x="0" y="0" class="comment">ANTES:</text>
      <rect x="0" y="10" width="60" height="40" class="var-box" rx="4"/>
      <text x="30" y="28" text-anchor="middle" class="var">a</text>
      <text x="30" y="43" text-anchor="middle" class="value">5</text>
      
      <rect x="80" y="10" width="60" height="40" class="var-box" rx="4"/>
      <text x="110" y="28" text-anchor="middle" class="var">b</text>
      <text x="110" y="43" text-anchor="middle" class="value">9</text>
    </g>
    
    <!-- Operación -->
    <rect x="0" y="80" width="180" height="35" fill="#3498db" rx="6"/>
    <text x="90" y="103" text-anchor="middle" fill="white" class="text">a, b = b, a</text>
    
    <!-- Después -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" class="comment">DESPUÉS:</text>
      <rect x="0" y="10" width="60" height="40" class="var-box" rx="4"/>
      <text x="30" y="28" text-anchor="middle" class="var">a</text>
      <text x="30" y="43" text-anchor="middle" class="value">9</text>
      
      <rect x="80" y="10" width="60" height="40" class="var-box" rx="4"/>
      <text x="110" y="28" text-anchor="middle" class="var">b</text>
      <text x="110" y="43" text-anchor="middle" class="value">5</text>
    </g>
    
    <!-- Nota -->
    <rect x="0" y="185" width="350" height="55" fill="#d1ecf1" stroke="#bee5eb" stroke-width="2" rx="6"/>
    <text x="10" y="208" class="text" fill="#0c5460">💡 Sin variable temporal</text>
    <text x="10" y="228" class="comment" fill="#0c5460">En otros lenguajes necesitás temp=a; a=b; b=temp</text>
  </g>
  
  <!-- Ejemplo 3: Retornar múltiples valores -->
  <g transform="translate(50, 320)">
    <text x="0" y="0" class="subtitle">3️⃣ Retornar Múltiples Valores de Función</text>
    
    <rect x="0" y="20" width="700" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <text x="20" y="45" class="text">def calcular_estadisticas(numeros):</text>
    <text x="40" y="68" class="text">    minimo = min(numeros)</text>
    <text x="40" y="88" class="text">    maximo = max(numeros)</text>
    <text x="40" y="108" class="text">    promedio = sum(numeros) / len(numeros)</text>
    <text x="40" y="128" class="text" fill="#e74c3c">    return minimo, maximo, promedio</text>
    <text x="400" y="128" class="comment">← Devuelve tupla</text>
    
    <!-- Uso -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="700" height="100" fill="#e8f8f5" stroke="#a9dfbf" stroke-width="2" rx="8"/>
      
      <text x="20" y="25" class="text">datos = [10, 5, 8, 12, 3, 9]</text>
      <text x="20" y="50" class="text" fill="#8e44ad">min_val, max_val, prom = calcular_estadisticas(datos)</text>
      <text x="20" y="75" class="comment">print(f"Mínimo: {min_val}, Máximo: {max_val}, Promedio: {prom}")</text>
      <text x="20" y="92" class="comment">→ Mínimo: 3, Máximo: 12, Promedio: 7.83</text>
    </g>
  </g>
  
  <!-- Ejemplo 4: Ignorar valores con _ -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" class="subtitle">4️⃣ Ignorar Valores con _ (guión bajo)</text>
    
    <rect x="0" y="20" width="700" height="60" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
    <text x="20" y="45" class="text">nombre, _, edad = ("Ana", "García", 25)</text>
    <text x="20" y="65" class="comment"># Solo usamos nombre y edad, ignoramos apellido con _</text>
  </g>
</svg>
