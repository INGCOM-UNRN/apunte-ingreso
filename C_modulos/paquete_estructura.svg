<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .title { font: bold 18px sans-serif; fill: #2c3e50; }
      .label { font: 14px sans-serif; fill: #34495e; }
      .code { font: 12px monospace; fill: #27ae60; }
      .folder { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .file { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .init { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .line { stroke: #bdc3c7; stroke-width: 2; }
      .small-text { font: 11px sans-serif; fill: #7f8c8d; }
    </style>
  </defs>

  <text x="450" y="30" class="title" text-anchor="middle"> Estructura de un Paquete Python</text>
  
  <!-- Proyecto raíz -->
  <rect x="50" y="60" width="200" height="50" class="folder" rx="5"/>
  <text x="150" y="90" class="label" text-anchor="middle" font-weight="bold"> mi_proyecto/</text>
  
  <!-- Líneas de conexión -->
  <line x1="150" y1="110" x2="150" y2="150" class="line"/>
  <line x1="150" y1="150" x2="100" y2="150" class="line"/>
  <line x1="150" y1="150" x2="200" y2="150" class="line"/>
  
  <!-- programa.py -->
  <rect x="30" y="160" width="140" height="40" class="file" rx="3"/>
  <text x="100" y="185" class="code" text-anchor="middle">📄 programa.py</text>
  
  <!-- Paquete matematicas -->
  <rect x="180" y="160" width="180" height="40" class="folder" rx="3"/>
  <text x="270" y="185" class="label" text-anchor="middle" font-weight="bold"> matematicas/</text>
  
  <!-- Expansión del paquete matematicas -->
  <line x1="270" y1="200" x2="270" y2="240" class="line"/>
  <line x1="270" y1="240" x2="200" y2="240" class="line"/>
  <line x1="270" y1="240" x2="270" y2="240" class="line"/>
  <line x1="270" y1="240" x2="340" y2="240" class="line"/>
  
  <!-- __init__.py -->
  <rect x="130" y="250" width="140" height="40" class="init" rx="3"/>
  <text x="200" y="275" class="code" text-anchor="middle" fill="white">📄 __init__.py</text>
  
  <!-- geometria.py -->
  <rect x="280" y="250" width="140" height="40" class="file" rx="3"/>
  <text x="350" y="275" class="code" text-anchor="middle">📄 geometria.py</text>
  
  <!-- aritmetica.py -->
  <rect x="130" y="300" width="140" height="40" class="file" rx="3"/>
  <text x="200" y="325" class="code" text-anchor="middle">📄 aritmetica.py</text>
  
  <!-- estadistica.py -->
  <rect x="280" y="300" width="140" height="40" class="file" rx="3"/>
  <text x="350" y="325" class="code" text-anchor="middle">📄 estadistica.py</text>
  
  <!-- Explicaciones -->
  <text x="50" y="380" class="title">💡 ¿Qué es cada cosa?</text>
  
  <!-- Carpeta proyecto -->
  <rect x="50" y="400" width="380" height="60" class="folder" rx="3" opacity="0.3"/>
  <text x="60" y="420" class="label" font-weight="bold"> Carpeta del Proyecto:</text>
  <text x="70" y="440" class="small-text">Contiene todo tu proyecto. Es como el "edificio"</text>
  <text x="70" y="455" class="small-text">que aloja todos los archivos de tu programa.</text>
  
  <!-- __init__.py -->
  <rect x="450" y="400" width="400" height="60" class="init" rx="3" opacity="0.3"/>
  <text x="460" y="420" class="label" font-weight="bold" fill="white">📄 __init__.py (archivo mágico):</text>
  <text x="470" y="440" class="small-text" fill="white">Le dice a Python "¡Esta carpeta es un paquete!"</text>
  <text x="470" y="455" class="small-text" fill="white">Puede estar vacío o tener código de inicialización.</text>
  
  <!-- Módulos -->
  <rect x="50" y="470" width="380" height="60" class="file" rx="3" opacity="0.3"/>
  <text x="60" y="490" class="label" font-weight="bold">📄 Módulos (.py):</text>
  <text x="70" y="510" class="small-text">Archivos con funciones relacionadas. Cada uno es</text>
  <text x="70" y="525" class="small-text">como un "cuarto" con herramientas específicas.</text>
  
  <!-- Programa principal -->
  <rect x="450" y="470" width="400" height="60" class="file" rx="3" opacity="0.3"/>
  <text x="460" y="490" class="label" font-weight="bold">📄 programa.py (principal):</text>
  <text x="470" y="510" class="small-text">Tu programa principal que IMPORTA y USA los</text>
  <text x="470" y="525" class="small-text">módulos del paquete. Es el "director de orquesta".</text>
  
  <!-- Analogía final -->
  <text x="450" y="565" class="title" text-anchor="middle">🏢 Paquete = Edificio con oficinas especializadas</text>
</svg>
