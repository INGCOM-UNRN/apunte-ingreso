<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .title { font: bold 20px sans-serif; fill: #2c3e50; }
      .label { font: 16px sans-serif; fill: #34495e; }
      .code { font: 14px monospace; fill: #27ae60; }
      .file { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .function { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 5; }
      .function-text { font: 14px monospace; fill: white; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- Título -->
  <text x="400" y="30" class="title" text-anchor="middle">🎁 ¿Qué es un Módulo?</text>
  
  <!-- Archivo del módulo -->
  <rect x="50" y="60" width="300" height="300" class="file"/>
  <text x="200" y="90" class="label" text-anchor="middle" font-weight="bold">📄 matematicas.py</text>
  
  <!-- Contenido del módulo -->
  <line x1="70" y1="100" x2="330" y2="100" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Variables -->
  <circle cx="90" cy="130" r="5" fill="#9b59b6"/>
  <text x="105" y="135" class="code">PI = 3.14159</text>
  
  <!-- Funciones -->
  <rect x="70" y="150" width="260" height="40" class="function"/>
  <text x="200" y="175" class="function-text">def area_circulo(radio):</text>
  
  <rect x="70" y="200" width="260" height="40" class="function"/>
  <text x="200" y="225" class="function-text">def perimetro_circulo(radio):</text>
  
  <rect x="70" y="250" width="260" height="40" class="function"/>
  <text x="200" y="275" class="function-text">def factorial(n):</text>
  
  <text x="200" y="320" class="label" text-anchor="middle" font-style="italic">Una caja de herramientas</text>
  
  <!-- Programa que importa -->
  <rect x="450" y="60" width="300" height="300" class="file"/>
  <text x="600" y="90" class="label" text-anchor="middle" font-weight="bold">📄 programa.py</text>
  
  <line x1="470" y1="100" x2="730" y2="100" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Código que usa el módulo -->
  <text x="480" y="130" class="code">import matematicas</text>
  <text x="480" y="160" class="code">area = matematicas.area_circulo(5)</text>
  <text x="480" y="190" class="code">print(area)</text>
  <text x="600" y="230" class="label" text-anchor="middle"> ¡Usa las herramientas!</text>
  
  <!-- Flechas de importación -->
  <path d="M 350 150 L 450 150" class="arrow"/>
  <path d="M 350 200 L 450 180" class="arrow"/>
  <path d="M 350 250 L 450 170" class="arrow"/>
  
  <text x="400" y="140" class="label" text-anchor="middle" font-size="12">import</text>
</svg>
