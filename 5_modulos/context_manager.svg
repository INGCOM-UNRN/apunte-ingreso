<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&amp;display=swap');
      .title { font: bold 18px sans-serif; fill: #2c3e50; }
      .label { font: 14px sans-serif; fill: #34495e; }
      .code { font: 12px monospace; fill: #27ae60; }
      .code-bad { font: 12px monospace; fill: #e74c3c; }
      .box-bad { fill: #fadbd8; stroke: #e74c3c; stroke-width: 3; rx: 8; }
      .box-good { fill: #d5f4e6; stroke: #27ae60; stroke-width: 3; rx: 8; }
      .step { fill: #3498db; }
      .step-text { font: bold 14px sans-serif; fill: white; text-anchor: middle; }
      .warning { fill: #e74c3c; font-weight: bold; }
      .success { fill: #27ae60; font-weight: bold; }
    </style>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">🔐 Context Manager: La Palabra Mágica "with"</text>
  
  <!-- Forma manual (mala) -->
  <text x="200" y="70" class="title" text-anchor="middle">❌ Forma Manual (Peligrosa)</text>
  
  <rect x="30" y="85" width="340" height="180" class="box-bad"/>
  
  <!-- Paso 1 -->
  <circle cx="50" cy="110" r="18" class="step"/>
  <text x="50" y="117" class="step-text">1</text>
  <text x="80" y="117" class="code-bad">archivo = open("datos.txt", "r")</text>
  
  <!-- Paso 2 -->
  <circle cx="50" cy="145" r="18" class="step"/>
  <text x="50" y="152" class="step-text">2</text>
  <text x="80" y="152" class="code-bad">contenido = archivo.read()</text>
  
  <!-- Problema -->
  <text x="80" y="177" class="warning" font-size="13"> ¿Y si hay un error aquí?</text>
  <text x="80" y="195" class="code-bad">procesar(contenido)  # Error!</text>
  
  <!-- Paso 3 -->
  <circle cx="50" cy="220" r="18" class="step"/>
  <text x="50" y="227" class="step-text">3</text>
  <text x="80" y="227" class="code-bad">archivo.close()  </text>
  <text x="240" y="227" class="warning" font-size="11">← ¡Nunca llega!</text>
  
  <text x="200" y="255" class="label" text-anchor="middle" font-size="12">⚠️ El archivo queda abierto</text>
  
  <!-- Forma con with (buena) -->
  <text x="600" y="70" class="title" text-anchor="middle">✅ Forma Segura (with)</text>
  
  <rect x="430" y="85" width="340" height="180" class="box-good"/>
  
  <text x="450" y="115" class="code">with open("datos.txt", "r") as archivo:</text>
  
  <!-- Paso 1 automático -->
  <circle cx="450" cy="135" r="15" fill="#3498db"/>
  <text x="450" y="141" class="step-text" font-size="12">1</text>
  <text x="475" y="141" class="label" font-size="12">Abre automáticamente</text>
  
  <!-- Paso 2 -->
  <circle cx="460" cy="165" r="15" fill="#3498db"/>
  <text x="460" y="171" class="step-text" font-size="12">2</text>
  <text x="480" y="171" class="code">contenido = archivo.read()</text>
  <text x="480" y="191" class="code">procesar(contenido)  # Error!</text>
  
  <!-- Paso 3 automático -->
  <circle cx="460" cy="220" r="15" fill="#27ae60"/>
  <text x="460" y="226" class="step-text" font-size="12">3</text>
  <text x="485" y="226" class="success" font-size="12">Se cierra SIEMPRE </text>
  
  <text x="600" y="255" class="label" text-anchor="middle" font-size="12">✅ Incluso si hay error</text>
  
  <!-- Explicación visual -->
  <text x="400" y="300" class="title" text-anchor="middle">💡 ¿Cómo Funciona "with"?</text>
  
  <rect x="50" y="320" width="700" height="160" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="8"/>
  
  <!-- Entrada -->
  <rect x="70" y="340" width="200" height="50" fill="#3498db" rx="5"/>
  <text x="170" y="360" class="label" text-anchor="middle" fill="white" font-weight="bold">ENTRADA al bloque</text>
  <text x="170" y="380" class="label" text-anchor="middle" fill="white">with abre el recurso</text>
  
  <!-- Trabajo -->
  <rect x="300" y="340" width="200" height="50" fill="#9b59b6" rx="5"/>
  <text x="400" y="360" class="label" text-anchor="middle" fill="white" font-weight="bold">DENTRO del bloque</text>
  <text x="400" y="380" class="label" text-anchor="middle" fill="white">Usás el recurso</text>
  
  <!-- Salida -->
  <rect x="530" y="340" width="200" height="50" fill="#27ae60" rx="5"/>
  <text x="630" y="360" class="label" text-anchor="middle" fill="white" font-weight="bold">SALIDA del bloque</text>
  <text x="630" y="380" class="label" text-anchor="middle" fill="white">with cierra el recurso</text>
  
  <!-- Flecha de flujo -->
  <path d="M 270 365 L 295 365" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 365 L 525 365" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
  </marker>
  
  <!-- Beneficios -->
  <text x="70" y="420" class="label" font-weight="bold"> Beneficios del Context Manager:</text>
  <text x="90" y="440" class="label">• Cierre automático garantizado</text>
  <text x="90" y="460" class="label">• Más legible y conciso</text>
  <text x="400" y="440" class="label">• Maneja errores correctamente</text>
  <text x="400" y="460" class="label">• No te olvidás de cerrar recursos</text>
</svg>
