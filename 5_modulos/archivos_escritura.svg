<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #2c3e50; }
      .label { font: 14px sans-serif; fill: #34495e; }
      .code { font: 12px monospace; fill: #27ae60; }
      .mode-box { stroke-width: 3; rx: 8; }
      .mode-title { font: bold 15px sans-serif; text-anchor: middle; }
      .warning { fill: #e74c3c; }
    </style>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">✍️ Modos de Escritura de Archivos</text>
  
  <!-- Modo "w" (write) -->
  <rect x="50" y="60" width="220" height="160" class="mode-box" fill="#fadbd8" stroke="#e74c3c"/>
  <text x="160" y="90" class="mode-title" fill="#c0392b">"w" - Write (Sobrescribe)</text>
  
  <!-- Antes -->
  <rect x="70" y="105" width="80" height="50" fill="white" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="110" y="120" class="label" text-anchor="middle" font-size="11">Antes:</text>
  <text x="75" y="135" class="code" font-size="10">Línea 1</text>
  <text x="75" y="147" class="code" font-size="10">Línea 2</text>
  
  <!-- Después -->
  <rect x="160" y="105" width="80" height="50" fill="white" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="200" y="120" class="label" text-anchor="middle" font-size="11">Después:</text>
  <text x="165" y="135" class="code" font-size="10">Nuevo texto</text>
  
  <text x="160" y="175" class="warning" text-anchor="middle" font-size="13">⚠️ BORRA todo</text>
  <text x="70" y="195" class="code" font-size="11">with open("f.txt", "w") as f:</text>
  <text x="80" y="210" class="code" font-size="11">f.write("Nuevo texto")</text>
  
  <!-- Modo "a" (append) -->
  <rect x="290" y="60" width="220" height="160" class="mode-box" fill="#d5f4e6" stroke="#27ae60"/>
  <text x="400" y="90" class="mode-title" fill="#27ae60">"a" - Append (Agrega)</text>
  
  <!-- Antes -->
  <rect x="310" y="105" width="80" height="50" fill="white" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="350" y="120" class="label" text-anchor="middle" font-size="11">Antes:</text>
  <text x="315" y="135" class="code" font-size="10">Línea 1</text>
  <text x="315" y="147" class="code" font-size="10">Línea 2</text>
  
  <!-- Después -->
  <rect x="400" y="105" width="80" height="65" fill="white" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="440" y="120" class="label" text-anchor="middle" font-size="11">Después:</text>
  <text x="405" y="135" class="code" font-size="10">Línea 1</text>
  <text x="405" y="147" class="code" font-size="10">Línea 2</text>
  <text x="405" y="159" class="code" font-size="10">Línea 3 </text>
  
  <text x="400" y="185" class="label" text-anchor="middle" fill="#27ae60" font-size="13">✅ Mantiene todo</text>
  <text x="310" y="205" class="code" font-size="11">with open("f.txt", "a") as f:</text>
  <text x="320" y="220" class="code" font-size="11">f.write("Línea 3")</text>
  
  <!-- Modo "x" (exclusive) -->
  <rect x="530" y="60" width="220" height="160" class="mode-box" fill="#dfe6e9" stroke="#2980b9"/>
  <text x="640" y="90" class="mode-title" fill="#2980b9">"x" - Exclusive (Crea)</text>
  
  <text x="640" y="120" class="label" text-anchor="middle">Si el archivo NO existe:</text>
  <rect x="560" y="130" width="160" height="30" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="640" y="150" class="label" text-anchor="middle" fill="#27ae60">✅ Lo crea</text>
  
  <text x="640" y="175" class="label" text-anchor="middle">Si el archivo YA existe:</text>
  <rect x="560" y="185" width="160" height="30" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="3"/>
  <text x="640" y="205" class="label" text-anchor="middle" fill="#c0392b">❌ Error</text>
  
  <!-- Tabla comparativa -->
  <text x="400" y="250" class="title" text-anchor="middle">📋 Comparación Rápida</text>
  
  <rect x="50" y="270" width="700" height="150" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
  
  <!-- Headers -->
  <text x="130" y="295" class="label" font-weight="bold" text-anchor="middle">Modo</text>
  <text x="270" y="295" class="label" font-weight="bold" text-anchor="middle">¿Borra contenido?</text>
  <text x="440" y="295" class="label" font-weight="bold" text-anchor="middle">¿Puede leer?</text>
  <text x="600" y="295" class="label" font-weight="bold" text-anchor="middle">Cuándo usar</text>
  
  <line x1="60" y1="300" x2="740" y2="300" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Row "w" -->
  <text x="130" y="325" class="code" text-anchor="middle" font-weight="bold">"w"</text>
  <text x="270" y="325" class="warning" text-anchor="middle">Sí ⚠️</text>
  <text x="440" y="325" class="label" text-anchor="middle">No</text>
  <text x="600" y="325" class="label" text-anchor="middle" font-size="12">Crear nuevo</text>
  
  <!-- Row "a" -->
  <text x="130" y="355" class="code" text-anchor="middle" font-weight="bold">"a"</text>
  <text x="270" y="355" class="label" text-anchor="middle" fill="#27ae60">No ✅</text>
  <text x="440" y="355" class="label" text-anchor="middle">No</text>
  <text x="600" y="355" class="label" text-anchor="middle" font-size="12">Agregar al final</text>
  
  <!-- Row "x" -->
  <text x="130" y="385" class="code" text-anchor="middle" font-weight="bold">"x"</text>
  <text x="270" y="385" class="label" text-anchor="middle">N/A</text>
  <text x="440" y="385" class="label" text-anchor="middle">No</text>
  <text x="600" y="385" class="label" text-anchor="middle" font-size="12">Solo si no existe</text>
  
  <!-- Row "r+" -->
  <text x="130" y="415" class="code" text-anchor="middle" font-weight="bold">"r+"</text>
  <text x="270" y="415" class="label" text-anchor="middle" fill="#27ae60">No ✅</text>
  <text x="440" y="415" class="label" text-anchor="middle" fill="#27ae60">Sí ✅</text>
  <text x="600" y="415" class="label" text-anchor="middle" font-size="12">Leer y escribir</text>
</svg>
